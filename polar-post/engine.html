<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Полярная почта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=PT+Mono&family=Rubik+Mono+One&display=swap">
<style>
/* Layout concept: a polar post office in daylight. The task is a letter on paper with an airmail border (red and blue stripes) on the left; the right column stays in view: a sheet of nine postage stamps (a finished step gets its picture and a postmark; stamps are also jump buttons), a remote with the arrows and the step counter, and the penguin postman Peter whose speech bubble is the answer panel, so answers never cover the task. Headings are set in a heavy stamp face, sentences in a typewriter face so commas stay easy to see. Snow drifts and falling snow sit far behind. */
*{box-sizing:border-box}
:root{
  color-scheme:light;
  --gx:clamp(16px,4vw,36px);
  --sky-a:#cfe8f6;--sky-b:#eaf6fc;
  --ink:#10304a;--ink-soft:#4a6a82;--paper:#fffdf8;--line:#d3e3ee;--tint:#eef6fb;--tint-line:#cfe2ee;
  --red:#d23b3b;--blue:#1f6fb8;--gold:#f2b134;
  --c:#1f6fb8;--c-deep:#154d82;--ct:#dcecf9;
  --ok:#1f8a4c;--ok-t:#e1f4e8;--bad:#c23b2e;--mint:#17a58a;--amber:#d98200;--focus:#1d6fe0;
  --f-head:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --f-ui:"Manrope","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --f-text:"PT Mono","Courier New",ui-monospace,monospace;
}
/* у каждого блока урока свой цвет */
html[data-b="1"]{--c:#1f6fb8;--c-deep:#154d82;--ct:#dcecf9}
html[data-b="2"]{--c:#c0392b;--c-deep:#8a251b;--ct:#fbe2de}
html[data-b="3"]{--c:#13808b;--c-deep:#0b5560;--ct:#d8eff2}
html[data-b="4"]{--c:#6b4fb8;--c-deep:#473384;--ct:#e8e1f7}
html[data-b="5"]{--c:#b85c08;--c-deep:#7f3f03;--ct:#fde7cf}
[hidden]{display:none!important}
html{height:100%;background:var(--sky-b)}
body{position:relative;min-height:100%;margin:0;color:var(--ink);font:500 17px/1.55 var(--f-ui);background-color:var(--sky-b);background-image:radial-gradient(900px 480px at 12% -8%,rgba(255,255,255,.85),transparent 62%),linear-gradient(180deg,var(--sky-a) 0,var(--sky-b) 42%,#fbfdff 78%,#fff 100%);background-attachment:fixed;-webkit-text-size-adjust:100%}
h1,h2,h3,p,ol,ul{margin:0}

/* ---------- далеко позади: сугробы, ёлки, снег ---------- */
.snowfield{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.drift{position:absolute;left:0;bottom:0;width:100%;height:26vh;min-height:130px}
.flake{position:absolute;top:-12px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.9);opacity:.9;animation:fall linear infinite}
.flake:nth-child(1){left:6%;animation-duration:19s;animation-delay:-3s}
.flake:nth-child(2){left:14%;width:5px;height:5px;animation-duration:24s;animation-delay:-11s}
.flake:nth-child(3){left:23%;animation-duration:21s;animation-delay:-7s}
.flake:nth-child(4){left:31%;width:9px;height:9px;animation-duration:27s;animation-delay:-16s}
.flake:nth-child(5){left:42%;width:5px;height:5px;animation-duration:18s;animation-delay:-2s}
.flake:nth-child(6){left:51%;animation-duration:23s;animation-delay:-9s}
.flake:nth-child(7){left:60%;width:6px;height:6px;animation-duration:20s;animation-delay:-14s}
.flake:nth-child(8){left:68%;width:9px;height:9px;animation-duration:26s;animation-delay:-5s}
.flake:nth-child(9){left:76%;animation-duration:22s;animation-delay:-18s}
.flake:nth-child(10){left:84%;width:5px;height:5px;animation-duration:25s;animation-delay:-8s}
.flake:nth-child(11){left:91%;animation-duration:19s;animation-delay:-13s}
.flake:nth-child(12){left:97%;width:6px;height:6px;animation-duration:28s;animation-delay:-1s}

/* ---------- каркас: письмо слева, правая колонка всегда на виду ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,780px) 300px;gap:30px;justify-content:center;align-items:start;max-width:1180px;margin:0 auto;padding:26px max(var(--gx),env(safe-area-inset-right,0px)) 200px max(var(--gx),env(safe-area-inset-left,0px))}
.main{grid-column:1;grid-row:1;min-width:0}
.side{grid-column:2;grid-row:1;position:sticky;top:22px;display:grid;gap:14px;align-content:start}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 30px -18px rgba(16,48,74,.5)}
.stp{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;place-items:center;aspect-ratio:5/6;background:#f3f8fc;border:4px dotted #b3cadb;border-radius:3px;color:#8aa6ba;font:400 18px/1 var(--f-head);overflow:visible;transition:transform .15s}
.stp:hover{transform:translateY(-2px)}
.stp:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stp svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stp.on{background:var(--sc);border-color:#fff;box-shadow:0 0 0 2px var(--sc),0 4px 10px -4px rgba(16,48,74,.6)}
.stp.on::after{content:"";position:absolute;right:-9px;bottom:-9px;width:62%;aspect-ratio:1;border:2px solid rgba(16,48,74,.7);border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(16,48,74,.5) 5px 6.5px);transform:rotate(-14deg);opacity:.85}
.stp.cur:not(.on){border-color:var(--red);color:var(--red);animation:spulse 1.6s ease-in-out infinite}
.stp.pop{animation:popin .6s ease-out}
.pult{display:flex;align-items:center;gap:8px;padding:8px;border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(16,48,74,.55)}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.pbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.pbtn:hover:not(:disabled){filter:brightness(1.1)}
.pbtn:active:not(:disabled){transform:scale(.94)}
.pbtn:disabled{opacity:.3;cursor:default}
.pbtn:focus-visible,.pmid:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pmid{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;padding:7px 4px;text-align:center;color:var(--ink);font:800 13px/1.2 var(--f-ui);white-space:nowrap;border-radius:99px}
.pmid:hover{background:var(--tint)}
.stat{display:block;text-align:center;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink-soft);font:800 12px/1.2 var(--f-ui)}

/* ---------- пингвин-почтальон и его облачко ---------- */
.pbox{display:flex;align-items:flex-end;gap:10px;min-height:96px}
.peng{flex:none;width:78px;height:auto;animation:bob 4.8s ease-in-out infinite}
.peng .eye{fill:#10304a}
.peng .eyes-ok{display:none;fill:none;stroke:#10304a;stroke-width:2.6;stroke-linecap:round}
.pbox.ok .eyes-idle,.pbox.free .eyes-idle{display:none}
.pbox.ok .eyes-ok,.pbox.free .eyes-ok{display:inline}
.peng .brow{display:none;fill:none;stroke:#10304a;stroke-width:2.6;stroke-linecap:round}
.pbox.bad .brow{display:inline}
.pbox.bad .peng{animation:shake .5s,bob 4.8s ease-in-out infinite}
.pbox.free .peng{animation:hop 1.2s ease-in-out infinite}
.bubble{position:relative;flex:1;min-width:0;margin-bottom:22px;display:flex;gap:8px;align-items:flex-start;padding:11px 8px 11px 14px;background:#fff;color:var(--ink);border:3px solid var(--blue);border-radius:18px;box-shadow:0 14px 28px -14px rgba(16,48,74,.55)}
.bubble::before{content:"";position:absolute;left:-11px;bottom:16px;width:16px;height:16px;background:#fff;border-left:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:rotate(45deg)}
.bubble .tx2{flex:1;min-width:0;font-size:14.5px;line-height:1.45}
.bubble .lb{display:block;margin-bottom:2px;font:800 11px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.bubble .dx{all:unset;box-sizing:border-box;cursor:pointer;flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--ink-soft);font:700 20px/1 var(--f-ui)}
.bubble .dx:hover{background:rgba(0,0,0,.07)}
.bubble .dx:focus-visible{outline:3px solid var(--focus)}
.bubble.ok{border-color:var(--ok)}
.bubble.ok::before{border-color:var(--ok)}
.bubble.ok .lb{color:var(--ok)}
.bubble.bad{border-color:var(--bad)}
.bubble.bad::before{border-color:var(--bad)}
.bubble.bad .lb{color:var(--bad)}
.bubble.pop{animation:rise .3s ease-out}

/* ---------- заголовок и письмо ---------- */
.topline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;margin-bottom:16px}
.topline h1{display:inline-block;padding:6px 14px 7px;border:3px solid var(--red);border-radius:6px;color:var(--red);font:400 clamp(17px,2.4vw,24px)/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;transform:rotate(-1.5deg);background:rgba(255,255,255,.55)}
.topline small{font:800 13px/1.2 var(--f-ui);color:var(--ink-soft)}
.letter{position:relative;min-height:min(58vh,500px);color:var(--ink);background:var(--paper);border:16px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px,var(--blue) 28px 42px,#fff 42px 56px) 16;box-shadow:0 26px 50px -22px rgba(16,48,74,.55);overflow:hidden}
.sh-head{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 20px 4px}
.nut{position:relative;display:inline-grid;place-items:center;flex:none;min-width:46px;height:54px;padding:0 6px;background:var(--c);color:#fff;border:4px dotted #fff;outline:2px solid var(--c);outline-offset:-1px;font:400 19px/1 var(--f-head)}
.sh-head h2{flex:1 1 8ch;min-width:0;font:400 clamp(17px,2.4vw,24px)/1.2 var(--f-head);color:var(--c-deep);text-transform:uppercase;text-wrap:balance;outline:none}
.sh-head .meta{margin-left:auto;padding:6px 14px;border-radius:99px;background:var(--ct);color:var(--c-deep);font:800 11.5px/1.2 var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.sh-head.hero .nut{background:var(--red);outline-color:var(--red)}
.sh-body{padding:12px 20px 26px}
.lead{max-width:60ch;margin-bottom:12px;font:600 18.5px/1.6 var(--f-ui)}
.task{max-width:66ch;margin-bottom:16px;color:var(--ink-soft)}
.rules{display:grid;gap:10px;margin:8px 0 22px;padding:0;list-style:none}
.rules li{display:flex;gap:12px;padding:10px 16px;border-radius:14px;background:var(--tint);border:1px solid var(--tint-line)}
.rules li::before{content:"";flex:none;width:12px;height:12px;margin-top:.5em;border-radius:50%;background:var(--c)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:18px}
.sub{margin:18px 0 10px;font:400 13px/1.2 var(--f-head);letter-spacing:.04em;text-transform:uppercase;color:var(--c-deep)}

/* ---------- кнопки ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:99px;font:800 15px/1 var(--f-ui);letter-spacing:.01em;text-align:center;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:focus-visible,.opt:focus-visible,.wd:focus-visible,.gp:focus-visible,.sgm button:focus-visible,.toc button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn-go{background:var(--c);color:#fff;box-shadow:0 12px 20px -10px rgba(16,48,74,.7),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn-go:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-go:active{transform:translateY(1px);box-shadow:0 4px 8px -4px rgba(16,48,74,.7),inset 0 -1px 0 rgba(0,0,0,.2)}
.btn-line{border:2px solid var(--c);color:var(--c-deep);background:#fff}
.btn-line:hover:not(:disabled){background:var(--ct)}
.btn-line:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:42px;padding:0 18px;font-size:13.5px}

/* ---------- объяснение ---------- */
.ex{display:grid;gap:12px;margin:0 0 6px;padding:0;list-style:none}
.ex>li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;padding:14px 18px 14px 14px;border-radius:14px;background:var(--tint);border:1px solid var(--tint-line);font-size:17.5px;line-height:1.6}
.ex>li>.no{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;font:400 16px/1 var(--f-head)}
.ex>li.new{animation:rise .35s ease-out}
.ex b{font-weight:800}
.ex i{font-family:var(--f-text);font-size:.98em}
.ex i b{color:var(--c-deep);font-size:1.15em}
.ex u{text-decoration-thickness:3px;text-underline-offset:4px}
.ex .box{display:block;margin-top:10px;padding:10px 16px;background:#fff;border:1px solid var(--tint-line);border-radius:12px;font-family:var(--f-text);font-size:.98em}
.ex .box span{display:block}
.ex .box b{color:var(--c-deep);font-size:1.15em}

/* ---------- выбор ответа ---------- */
.prog{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.prog i{width:30px;height:8px;border-radius:99px;background:var(--line)}
.prog i.d{background:var(--c)}
.prog i.c{background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.mc-p{margin:4px 0 12px;font-size:19px}
.big{font:400 clamp(18px,2.4vw,24px)/1.55 var(--f-text)}
.opts{display:grid;gap:12px;margin-top:8px;counter-reset:o}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 18px 12px 12px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:16px;font:400 clamp(15px,1.9vw,19px)/1.45 var(--f-text);box-shadow:0 4px 0 var(--line);counter-increment:o;transition:transform .12s,border-color .12s}
.opt::before{content:counter(o);flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ct);color:var(--c-deep);font:400 15px/1 var(--f-head)}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.opt.no{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.opt.no .ot{text-decoration:line-through}
.opt.right{background:var(--ok-t);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.right::before{content:"✓";background:var(--ok);color:#fff}
.opt:disabled{cursor:default}
.result{margin:10px 0 4px;padding:14px 18px;background:var(--ok-t);border:1px solid #b8dcc4;border-radius:14px;font-size:16.5px}

/* ---------- знаки: слова на строках письма и промежутки между ними ---------- */
.sent2{margin:14px 0 16px;padding:6px 18px;border-radius:14px;border:1px solid var(--tint-line);background-color:#fff;background-image:repeating-linear-gradient(180deg,transparent 0 calc(2.5em - 2px),#d9e8f2 calc(2.5em - 2px) 2.5em);background-origin:content-box;font:400 clamp(19px,2.5vw,25px)/2.5 var(--f-text);color:var(--ink)}
.tx{display:inline;padding:0 .02em}
.tx.s{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:7px;text-decoration-color:var(--mint)}
.tx.p{text-decoration:underline double;text-decoration-thickness:2px;text-underline-offset:7px;text-decoration-color:var(--amber)}
.gw{position:relative;display:inline-block;vertical-align:middle}
.gp{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:inline-grid;place-items:center;width:26px;height:1.7em;margin:0 1px;border-radius:8px}
.gp::before{content:"";position:absolute;left:50%;top:14%;bottom:14%;border-left:2px dashed #98b4c8;transform:translateX(-50%)}
.gp:hover:not(:disabled){background:var(--ct)}
.gp:hover:not(:disabled)::before,.gp:focus-visible::before{border-left:3px solid var(--c)}
.gp.has{width:auto;min-width:32px;margin:0 2px}
.gp.has::before{display:none}
.gp .sg{display:inline-grid;place-items:center;min-width:1.2em;height:1.2em;padding:0 .1em;background:var(--c);color:#fff;border-radius:50%;font:700 .85em/1 var(--f-ui);box-shadow:0 4px 8px -3px rgba(16,48,74,.6)}
.gp.good .sg{background:var(--ok)}
.gp.bad .sg{background:var(--bad);animation:shake .35s}
.cm{color:var(--c-deep);font-weight:700}

/* ---------- проверка письма: нажми на слово с ошибкой ---------- */
.sent{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;margin:12px 0 16px;font:400 clamp(18px,2.4vw,24px)/1.4 var(--f-text)}
.wg{display:inline-flex;align-items:flex-end;position:relative}
.wd{all:unset;box-sizing:border-box;position:relative;cursor:pointer;padding:5px 14px 7px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;font:inherit;transition:transform .08s,background .15s,border-color .15s}
.wd:hover:not(:disabled){background:var(--ct);border-color:var(--c)}
.wd:active:not(:disabled){transform:scale(.97)}
.wd:disabled{cursor:default}
.wd.fixed{background:var(--ok-t);border-color:var(--ok);color:#0e5c30}
.wd.no{animation:shake .35s;border-color:var(--bad)}
.wd.hint{animation:pulse 1s ease-in-out 4}
.pn{align-self:flex-end;margin:0 0 6px 2px}
.sgm{position:absolute;z-index:8;top:calc(100% + 4px);left:0;display:flex;flex-wrap:wrap;gap:8px;min-width:150px;padding:8px;background:#fff;border:2px solid var(--c);border-radius:16px;box-shadow:0 18px 34px -12px rgba(16,48,74,.55)}
.sgm button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;height:42px;padding:0 16px;background:var(--ct);border-radius:99px;font:700 16px/1 var(--f-ui);color:var(--ink);white-space:nowrap}
.sgm button:hover{background:var(--gold)}
.sgm button.bad{opacity:.4;text-decoration:line-through;cursor:default}

/* ---------- финал ---------- */
.found{display:grid;gap:10px;margin:0 0 14px;padding:0;list-style:none}
.found li{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start;padding:12px 16px;border-radius:14px;background:var(--tint);border:1px solid var(--tint-line);font-size:16.5px;line-height:1.55}
.found .no{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font:400 14px/1 var(--f-head)}
.hw{margin:16px 0;padding:16px 20px;background:#fff6d6;border:2px dashed #d9a21b;border-radius:16px;font-size:16.5px}
.hw b{color:#8a5a00}
.stats-line{margin:8px 0 4px;font:700 15px/1.6 var(--f-ui)}
.verdict{display:flex;justify-content:flex-end;margin:4px 0 16px}
.stamp{display:inline-block;padding:.12em .4em;border:4px solid var(--red);color:var(--red);font:400 clamp(16px,3.4vw,26px)/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;transform:rotate(-7deg);opacity:.9;border-radius:6px}
.stamp.in{animation:stampIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.heli{position:fixed;z-index:35;top:12vh;left:-160px;width:130px;pointer-events:none;fill:var(--red);animation:heli 7s ease-in-out 1 forwards}

.confetti{position:absolute;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;opacity:0;animation:cf 2.2s ease-in forwards}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),460px) rotate(var(--r))}}
@keyframes popin{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(2.2);opacity:0}60%{transform:rotate(-7deg) scale(.96);opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:.9}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,177,52,.6)}}

'use strict';

/* ======================= помощники ======================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* «Скорее, друзья!» -> слова и знак, который стоит сразу после слова */
const tokens=s=>s.split(/\s+/).filter(Boolean).map(x=>{const m=x.match(/^(.*?)([.,!?;:]*)$/);return {w:m[1],p:m[2]};});
/* для заданий со знаками: в строке знаки стоят правильно, слова приходят без них; exp[i] — знак после слова i */
function parseComma(s){
  const words=[],exp={};
  s.split(/\s+/).filter(Boolean).forEach((x,i)=>{
    const m=x.match(/^(.*?)([,:]?)([.!?]?)$/);
    words.push({w:m[1],end:m[3]});
    if(m[2])exp[i]=m[2];
  });
  return {words,exp};
}

/* ======================= реплики Петра на вступлении и в конце ======================= */
const HI={kind:'hi',html:'Скорее! Вертолёт скоро улетит, а письма и посылки перепутались. Нажмите «Начать».'};
const FREE={kind:'free',html:'Почта отправлена! Вертолёт улетел. Спасибо, сортировщик!'};

/* ======================= состояние ======================= */
let S;
const newState=()=>({phase:'brief',pi:0,mistakes:0,hints:3,msg:HI,refocus:null,rev:1,seen:{},mc:null,cm:null,sp:null});
const step=()=>STEPS[S.pi];
const mist=()=>{S.mistakes++;paintStats();};

/* ======================= сообщения ======================= */
const LABEL={info:'Подсказка',ok:'Верно',bad:'Не то',hi:'Пётр',free:'Пётр'};
function paintPA(){
  const el=$('#pa'),g=$('#peng');
  g.classList.remove('ok','bad','free');
  if(!S.msg){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  if(S.msg.kind==='ok'||S.msg.kind==='bad'||S.msg.kind==='free')g.classList.add(S.msg.kind);
  el.className='bubble '+(S.msg.kind==='ok'?'ok':S.msg.kind==='bad'?'bad':'');
  el.innerHTML=`<div class="tx2"><span class="lb">${LABEL[S.msg.kind]}</span>${S.msg.html}</div><button type="button" class="dx" data-act="dockx" aria-label="Закрыть сообщение">×</button>`;
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
}
/* на телефоне облачко лежит поверх страницы: прокручиваем так, чтобы кнопки задания остались над ним */
function nudge(){
  const el=$('#pa'),row=$$('#stage .row,#stage .opts').pop();
  if(el.hidden||!row)return;
  const d=el.getBoundingClientRect(),r=row.getBoundingClientRect();
  if(getComputedStyle($('#peng')).position==='fixed'&&r.bottom>d.top-12)window.scrollBy({top:r.bottom-d.top+20,behavior:reduceMotion()?'auto':'smooth'});
}
function say(kind,html){S.msg={kind,html};paintPA();setTimeout(nudge,0);}
const statsText=()=>`Ошибки ${S.mistakes} · Подсказки ${S.hints}`;
function paintStats(){$('#stats').textContent=statsText();}

/* ======================= экраны ======================= */
const head=(title,meta)=>`<div class="sh-head"><span class="nut">${S.pi+1}</span><h2 data-h tabindex="-1">${title}</h2><span class="meta">${meta}</span></div>`;
const V={};
const dotsHtml=(n,i)=>`<div class="prog" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k<i?'d':k===i?'c':''}"></i>`).join('')}</div>`;

V.brief=()=>`
<div class="sh-head hero"><span class="nut">№</span><h2 data-h tabindex="-1">Метель на станции</h2><span class="meta">Полярная почта</span></div>
<div class="sh-body">
<p class="lead">На далёкой полярной станции метель перемешала письма и посылки. На ярлыках пропали знаки препинания, в письмах потерялись запятые, а в одном письме появились ошибки.</p>
<p class="lead">До вылета вертолёта остался час. Пингвин-почтальон Пётр просит помощи. Вы сортировщик почты: приведите всё в порядок.</p>
<ul class="rules"><li>Сначала объяснение, потом задания.</li><li>За каждое задание на листе марок появляется марка с печатью.</li><li>Ошибки не страшны, подсказок три. Слайды переключают стрелки.</li></ul>
<div class="row"><button type="button" class="btn btn-go" data-act="start" data-af>Начать</button></div>
</div>`;

V.explain=st=>{
  const total=st.points.length,n=st.all?total:Math.min(S.rev,total),last=n>=total;
  const list=st.points.slice(0,n).map((p,i)=>`<li${i===n-1&&n>1&&!st.all?' class="new"':''}><span class="no">${i+1}</span><div>${p}</div></li>`).join('');
  const btn=last?`<button type="button" class="btn btn-go" data-act="exdone" data-af>${st.go||'К заданию'}</button>`:`<button type="button" class="btn btn-go" data-act="exmore" data-af>Дальше</button>`;
  return `${head(st.title,st.meta||'объяснение')}<div class="sh-body"><ol class="ex">${list}</ol><div class="row">${btn}</div></div>`;
};

V.mc=st=>{
  const m=S.mc,it=st.items[m.i],total=st.items.length;
  let af=false;
  const opts=m.ord.map(k=>{
    const o=it.o[k],dis=m.no.includes(k)||m.lock;
    const a=!dis&&!af?(af=true,' data-af'):'';
    const cls=['opt'];
    if(m.no.includes(k))cls.push('no');
    if(m.lock&&o.ok)cls.push('right');
    return `<button type="button" class="${cls.join(' ')}" data-act="mc" data-k="${k}"${dis?' disabled':''}${a}><span class="ot">${esc(o.t)}</span></button>`;
  }).join('');
  const ctl=m.lock?`<div class="row"><button type="button" class="btn btn-go" data-act="mcnext" data-af>${m.i===total-1?'Дальше':'Следующее'}</button></div>`:'';
  return `${head(st.title,'задание')}<div class="sh-body">${st.intro?`<p class="task">${st.intro}</p>`:''}${dotsHtml(total,m.i)}<p class="mc-p">${it.p}</p><div class="opts">${opts}</div>${ctl}</div>`;
};

V.commas=st=>{
  const C=S.cm,it=st.items[C.i],P=it._p,total=st.items.length,n=P.words.length;
  const mark=i=>it.subj.indexOf(i)>=0?1:(it.pred.indexOf(i)>=0?2:0);
  const show=C.ok||C.hint;
  const h=P.words.map((x,i)=>{
    const m=show?mark(i):0;
    const cls='tx'+(m===1?' s':m===2?' p':'');
    let after='';
    if(i<n-1){
      if(C.ok)after=P.exp[i]?`<span class="cm">${P.exp[i]}</span>`:'';
      else after=`<span class="gw"><button type="button" class="gp${C.cuts[i]?' has':''}${C.flags[i]?' '+C.flags[i]:''}" data-act="cgap" data-i="${i}" aria-label="Промежуток после слова «${esc(x.w)}»${C.cuts[i]?(C.cuts[i]===':'?', стоит двоеточие':', стоит запятая'):''}">${C.cuts[i]?`<span class="sg">${C.cuts[i]}</span>`:''}</button></span>`;
    }
    return `<span class="${cls}">${esc(x.w)}</span>${x.end?`<span>${x.end}</span>`:''}${after} `;
  }).join('');
  const res=C.ok?`<div class="result">${esc(it.why)}</div>`:'';
  const ctl=C.ok?`<div class="row"><button type="button" class="btn btn-go" data-act="cmnext" data-af>${C.i===total-1?'Дальше':'Следующее'}</button></div>`
    :`<div class="row"><button type="button" class="btn btn-go" data-act="cmcheck">Проверить</button><button type="button" class="btn btn-line sm" data-act="cmno">Знак не нужен</button><button type="button" class="btn btn-line sm" data-act="cmhint"${S.hints<1||C.hint?' disabled':''}>Подсказка</button><button type="button" class="btn btn-line sm" data-act="cmreset">Сбросить</button></div>`;
  return `${head(st.title,'знаки')}<div class="sh-body"><p class="task">${st.intro}</p>${dotsHtml(total,C.i)}<div class="sent2" aria-label="Предложение">${h}</div>${res}${ctl}</div>`;
};

V.spell=st=>{
  const P=S.sp,it=st.items[P.i],toks=tokens(it.s),bi=toks.findIndex(t=>t.w===it.bad),total=st.items.length;
  const chips=toks.map((t,i)=>{
    const cls=['wd'];
    if(P.fixed&&i===bi)cls.push('fixed');
    if(P.no===i)cls.push('no');
    if(P.hint&&i===bi&&!P.fixed)cls.push('hint');
    const word=P.fixed&&i===bi?it.o[0]:t.w;
    const menu=(P.menu&&i===bi&&!P.fixed)?`<div class="sgm" role="group" aria-label="Выберите написание">${P.ord.map(k=>`<button type="button" class="${P.wrong.includes(k)?'bad':''}" data-act="spopt" data-k="${k}"${P.wrong.includes(k)?' disabled':''}>${esc(it.o[k])}</button>`).join('')}</div>`:'';
    return `<span class="wg"><button type="button" class="${cls.join(' ')}" data-act="spw" data-i="${i}"${P.fixed?' disabled':''}>${esc(word)}</button>${menu}${t.p?`<span class="pn">${esc(t.p)}</span>`:''}</span>`;
  }).join(' ');
  const res=P.fixed?`<div class="result">${esc(it.rule)}</div>`:'';
  const ctl=P.fixed?`<div class="row"><button type="button" class="btn btn-go" data-act="spnext" data-af>${P.i===total-1?'Дальше':'Следующее'}</button></div>`
    :`<div class="row"><button type="button" class="btn btn-line sm" data-act="sphint"${S.hints<1||P.hint?' disabled':''}>Подсказка</button></div>`;
  return `${head(st.title,'орфография')}<div class="sh-body"><p class="task">${st.intro}</p>${dotsHtml(total,P.i)}<div class="sent" aria-label="Предложение письма">${chips}</div>${res}${ctl}</div>`;
};

V.end=()=>{
  const rank=S.mistakes<=6?'главный почтальон':S.mistakes<=14?'почтальон':'помощник почтальона';
  return `<div class="sh-head hero"><span class="nut">✓</span><h2 data-h tabindex="-1">Почта отправлена</h2><span class="meta">вертолёт улетел</span></div>
<div class="sh-body"><div class="verdict"><span class="stamp in">Отправлено</span></div>
<p class="lead">Ярлыки, письма и посылки приведены в порядок, а на листе марок стоят все девять печатей.</p>
<h3 class="sub">Что мы узнали</h3><ol class="found">
<li><span class="no">1</span><span><b>Однородные члены:</b> запятая между ними, перед одиночным «и» запятой нет, перед «а» и «но» запятая есть. Если «и» повторяется, запятая между всеми.</span></li>
<li><span class="no">2</span><span><b>Обобщающее слово</b> стоит перед перечислением, после него двоеточие: <i>В рюкзаке было всё нужное: фонарь, карта и компас.</i></span></li>
<li><span class="no">3</span><span><b>Обращение</b> выделяется запятыми и не является подлежащим: <i>Капитан, поднимите якорь!</i></span></li>
<li><span class="no">4</span><span><b>Вводные слова</b> (конечно, к сожалению, наверное) тоже выделяются запятыми. Слово «вдруг» не вводное.</span></li>
</ol>
<div class="hw"><b>Домашнее задание.</b> Рабочий лист: спишите предложения, поставьте знаки и подчеркните основы.</div>
<p class="stats-line">Ошибок: ${S.mistakes}. Подсказок использовано: ${3-S.hints}. Звание: <b>${rank}</b>.</p>
<div class="row"><button type="button" class="btn btn-go" data-act="again" data-af>Пройти ещё раз</button></div></div>`;
};

/* ======================= отрисовка ======================= */
function viewHtml(){
  if(S.phase==='brief')return V.brief();
  if(S.phase==='end')return V.end();
  const st=step();
  return V[st.t](st);
}
function nowText(){
  if(S.phase==='brief')return 'Знакомимся со станцией';
  if(S.phase==='end')return 'Почта отправлена';
  const st=step();
  return `Блок ${st.b} · ${BLOCKS[st.b]}`;
}
/* лист марок справа: марка получает картинку и печать, когда шаг пройден */
function paintStamps(){
  const box=$('#stamps');
  if(!box.children.length)box.innerHTML=STEPS.map((s,k)=>`<button type="button" class="stp" data-act="goto" data-i="${k+1}" style="--sc:${BC[s.b-1]}" title="${esc(s.title)}" aria-label="Шаг ${k+1}: ${esc(s.title)}"></button>`).join('');
  $$('#stamps .stp').forEach((b,k)=>{
    const on=S.phase==='end'||!!S.seen[STEPS[k].id],cur=S.phase==='step'&&S.pi===k,was=b.classList.contains('on');
    b.classList.toggle('on',on);b.classList.toggle('cur',cur);
    if(on!==was||!b.firstChild)b.innerHTML=on?ICONS[k]:String(k+1);
    if(cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
    if(on&&!was){b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),800);}
  });
}
let heliShown=false;
function paintHeli(){
  const el=$('#heli'),show=S.phase==='end';
  if(show&&!heliShown&&!reduceMotion()){el.hidden=false;el.style.animation='none';void el.getBoundingClientRect();el.style.animation='';setTimeout(()=>{el.hidden=true;},7200);}
  if(!show)el.hidden=true;
  heliShown=show;
}
function render(){
  document.documentElement.dataset.b=S.phase==='step'?String(step().b):'1';
  $('#now').textContent=nowText();
  $('#stage').innerHTML=viewHtml();
  paintStats();paintPA();paintNav();paintStamps();paintHeli();
  if(S.refocus){
    const el=(S.refocus==='af'&&$('#stage [data-af]'))||$('#stage [data-h]');
    if(el)el.focus({preventScroll:true});
    S.refocus=null;
  }
}
const toTop=()=>window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});
function confetti(n){
  if(reduceMotion())return;
  const host=$('#stage');
  const old=host.querySelector('.confetti');if(old)old.remove();
  const box=document.createElement('div');
  box.className='confetti';box.setAttribute('aria-hidden','true');
  const colors=['#d23b3b','#1f6fb8','#f2b134','#13808b','#6b4fb8','#ffffff'];
  for(let i=0;i<n;i++){
    const p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx',(Math.random()*160-80)+'px');
    p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    p.style.animationDelay=(Math.random()*.6)+'s';
    p.style.animationDuration=(1.6+Math.random()*1.2)+'s';
    box.appendChild(p);
  }
  host.appendChild(box);
  setTimeout(()=>box.remove(),3600);
}

/* ======================= ход урока ======================= */
function newComma(i){return {i:i||0,cuts:{},flags:{},ok:false,hint:false};}
function newSpell(i){return {i:i||0,menu:false,ord:[],wrong:[],fixed:false,no:null,hint:false};}
function enterStep(){
  S.rev=1;S.msg=null;
  const st=step();
  if(st.t==='mc'){S.mc={i:0,no:[],lock:false,ord:[]};prepItem();}
  if(st.t==='commas')S.cm=newComma(0);
  if(st.t==='spell')S.sp=newSpell(0);
}
function finishStep(){S.seen[step().id]=1;}
function nextStep(){
  finishStep();
  if(S.pi<STEPS.length-1){S.pi++;enterStep();S.refocus='h';render();toTop();}
  else{S.phase='end';S.msg=FREE;S.refocus='h';render();toTop();confetti(90);}
}
function onExMore(){S.rev++;S.refocus='af';render();}

/* выбор ответа */
function prepItem(){
  const st=step(),m=S.mc,it=st.items[m.i];
  m.no=[];m.lock=false;
  m.ord=shuffle(it.o.map((_,k)=>k));
}
function mcAdvance(){
  const st=step(),m=S.mc;
  if(m.i>=st.items.length-1){nextStep();return;}
  m.i++;prepItem();S.msg=null;S.refocus='af';render();
}
function onMC(k){
  const st=step(),m=S.mc,it=st.items[m.i],o=it.o[k];
  if(m.lock)return;
  if(o.ok){m.lock=true;if(m.i===st.items.length-1)S.seen[st.id]=1;S.refocus='af';render();say('ok',esc(o.why)||'Верно.');}
  else{m.no.push(k);mist();render();say('bad',esc(o.why)||'Не то. Подумайте ещё.');}
}

/* знаки между словами */
const pick=(it,st,key)=>it[key]||st[key];
function onCgap(i){
  const st=step(),C=S.cm;
  if(C.ok)return;
  const cyc=st.colon?[null,',',':']:[null,','],cur=C.cuts[i]||null,nx=cyc[(cyc.indexOf(cur)+1)%cyc.length];
  if(nx)C.cuts[i]=nx;else delete C.cuts[i];
  C.flags={};render();
}
function whyNot(it,st,P,i){
  const w=P.words[i].w,w2=P.words[i+1].w;
  if(it.inner&&it.inner.indexOf(i)>=0)return esc(it.innerMsg);
  if(it.one)return `В этом предложении основа одна: ${esc(it.one)}. Знак между частями нужен, когда основ две.`;
  if(it.listAnd&&w2.toLowerCase()==='и')return 'Перед одиночным «и» между однородными членами запятая не нужна.';
  const no=pick(it,st,'no');
  if(no)return esc(no);
  return `После слова «${esc(w)}» первая часть ещё не закончилась: границы между основами здесь нет. Запятая стоит там, где кончается одна основа и начинается другая.`;
}
function cmDone(it,st){const C=S.cm;C.ok=true;if(C.i===st.items.length-1)S.seen[st.id]=1;S.refocus='af';render();say('ok',esc(it.why));}
function onCmCheck(){
  const st=step(),C=S.cm,it=st.items[C.i],P=it._p,n=P.words.length;
  if(!Object.keys(C.cuts).length){say('info','Нажмите в промежутке между словами, чтобы поставить знак. Если знак не нужен, нажмите «Знак не нужен».');return;}
  const good=[],bad=[],wrong=[],miss=[];
  for(let i=0;i<n-1;i++){
    const have=C.cuts[i],need=P.exp[i];
    if(have&&have===need)good.push(i);
    else if(have&&!need)bad.push(i);
    else if(have&&need)wrong.push(i);
    else if(!have&&need)miss.push(i);
  }
  C.flags={};good.forEach(i=>{C.flags[i]='good';});bad.concat(wrong).forEach(i=>{C.flags[i]='bad';});
  if(!bad.length&&!wrong.length&&!miss.length){C.flags={};cmDone(it,st);return;}
  mist();
  let m='';
  if(bad.length)m=whyNot(it,st,P,bad[0]);
  else if(wrong.length)m=P.exp[wrong[0]]===':'?'После обобщающего слова ставится двоеточие, а не запятая.':'Двоеточие ставится только после обобщающего слова. Здесь нужна запятая.';
  if(miss.length)m+=(m?' ':'')+((bad.length||wrong.length)?'Кроме того, одного знака не хватает.':esc(pick(it,st,'miss')||'Не хватает знака. Найдите границу между основами или однородные члены.'));
  render();say('bad',m);
}
function onCmNo(){
  const st=step(),C=S.cm,it=st.items[C.i];
  if(C.ok)return;
  if(it.trap){C.cuts={};C.flags={};cmDone(it,st);}
  else{mist();C.flags={};render();say('bad',esc(pick(it,st,'need')||'Знак здесь нужен: в предложении две основы, а между основами ставится запятая. Найдите границу между ними.'));}
}
function onCmHint(){
  const st=step(),C=S.cm,it=st.items[C.i];
  if(S.hints<1||C.hint||C.ok)return;
  S.hints--;C.hint=true;render();
  const h=pick(it,st,'hint');
  say('info',h?esc(h):it.trap?'Основа выделена. Сколько основ в предложении?':'Основы выделены: подлежащие одной чертой, сказуемые двумя. Где нужен знак?');
}
function cmAdvance(){
  const st=step(),C=S.cm;
  if(C.i>=st.items.length-1){nextStep();return;}
  S.cm=newComma(C.i+1);S.msg=null;S.refocus='af';render();
}

/* проверка письма: найти слово с ошибкой и выбрать верное написание */
function onSpW(i){
  const st=step(),P=S.sp,it=st.items[P.i],toks=tokens(it.s),bi=toks.findIndex(t=>t.w===it.bad);
  if(P.fixed)return;
  if(i===bi){P.menu=true;P.ord=shuffle(it.o.map((_,k)=>k));P.no=null;S.msg=null;render();}
  else{P.menu=false;P.no=i;mist();render();say('bad','В этом слове ошибки нет. Ищите дальше.');}
}
function onSpOpt(k){
  const st=step(),P=S.sp,it=st.items[P.i];
  if(P.fixed)return;
  if(k===0){P.fixed=true;P.menu=false;P.no=null;if(P.i===st.items.length-1)S.seen[st.id]=1;S.refocus='af';render();say('ok',esc(it.rule));}
  else{P.wrong.push(k);mist();render();say('bad','Это написание неверное. Подумайте, как проверить слово.');}
}
function onSpHint(){
  const P=S.sp;
  if(S.hints<1||P.hint||P.fixed)return;
  S.hints--;P.hint=true;render();say('info','Слово с ошибкой подсвечено. Нажмите на него.');
}
function spAdvance(){
  const st=step(),P=S.sp;
  if(P.i>=st.items.length-1){nextStep();return;}
  S.sp=newSpell(P.i+1);S.msg=null;S.refocus='af';render();
}

/* переход по слайдам (стрелки) */
function slides(){
  const L=[{k:'brief',t:'Знакомство со станцией',b:0}];
  STEPS.forEach((s,pi)=>L.push({k:'step',pi,t:s.title,b:s.b}));
  L.push({k:'end',t:'Почта отправлена',b:6});
  return L;
}
function curIdx(L){
  if(S.phase==='brief')return 0;
  if(S.phase==='end')return L.length-1;
  return S.pi+1;
}
function goSlide(idx,dir){
  const L=slides();
  idx=Math.max(0,Math.min(L.length-1,idx));
  const T=L[idx];
  for(let i=1;i<=Math.min(idx-1,STEPS.length);i++)S.seen[STEPS[i-1].id]=1;
  S.msg=null;
  if(T.k==='brief'){S.phase='brief';S.msg=HI;}
  else if(T.k==='step'){S.phase='step';S.pi=T.pi;enterStep();if(step().t==='explain'&&dir<0)S.rev=step().points.length;}
  else{S.phase='end';S.msg=FREE;}
  render();toTop();
  if(T.k==='end')confetti(60);
}
function slideStep(dir){
  const L=slides(),i=curIdx(L);
  if(S.phase==='step'){
    const st=step();
    if(st.t==='explain'&&dir>0&&!st.all&&S.rev<st.points.length){S.rev++;render();return;}
  }
  goSlide(i+dir,dir);
}
function renderToc(L,cur){
  let h=`<p class="st">${esc(statsText())}</p>`,last=-1;
  L.forEach((x,k)=>{
    if(x.b!==last){
      last=x.b;
      h+=x.b===0?'<h3><i style="--rc:#f2b134"></i>Вступление</h3>':x.b===6?'<h3><i style="--rc:#d23b3b"></i>Финал</h3>':`<h3><i style="--rc:${BC[x.b-1]}"></i>Блок ${x.b} · ${esc(BLOCKS[x.b])}</h3>`;
    }
    h+=`<button type="button" data-act="goto" data-i="${k}"${k===cur?' class="cur" aria-current="step"':''}><span class="no">${x.k==='step'?x.pi+1:x.k==='end'?'★':'№'}</span><span>${esc(x.t)}</span></button>`;
  });
  $('#toc').innerHTML=h;
  const c=$('#toc .cur');
  if(c)$('#toc').scrollTop=Math.max(0,c.offsetTop-90);
}
function toggleToc(force){
  const el=$('#toc'),open=force===undefined?el.hidden:force;
  el.hidden=!open;
  $$('[data-act="toc"]').forEach(b=>b.setAttribute('aria-expanded',String(open)));
  if(open){const L=slides();renderToc(L,curIdx(L));}
}
function paintNav(){
  const L=slides(),i=curIdx(L),T=L[i];
  $('#navPrev').disabled=i===0;
  $('#navNext').disabled=i===L.length-1;
  $('#navNo').textContent=T.k==='step'?`Шаг ${T.pi+1} из ${STEPS.length}`:T.k==='end'?'Финал':'Начало';
  if(!$('#toc').hidden)renderToc(L,i);
}

/* ======================= события ======================= */
document.addEventListener('click',e=>{
  if(!$('#toc').hidden&&!e.target.closest('#toc,[data-act="toc"]'))toggleToc(false);
  if(S&&S.sp&&S.sp.menu&&!e.target.closest('.wg')){S.sp.menu=false;render();}
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  switch(b.dataset.act){
    case 'prev':slideStep(-1);break;
    case 'next':slideStep(1);break;
    case 'toc':toggleToc();break;
    case 'dockx':S.msg=null;paintPA();break;
    case 'goto':{const k=+b.dataset.i,cur=curIdx(slides());toggleToc(false);goSlide(k,k>cur?1:-1);break;}
    case 'start':S.phase='step';S.pi=0;enterStep();S.refocus='h';render();toTop();break;
    case 'exmore':onExMore();break;
    case 'exdone':nextStep();break;
    case 'mc':onMC(+b.dataset.k);break;
    case 'mcnext':mcAdvance();break;
    case 'cgap':onCgap(+b.dataset.i);break;
    case 'cmcheck':onCmCheck();break;
    case 'cmno':onCmNo();break;
    case 'cmhint':onCmHint();break;
    case 'cmreset':{const C=S.cm;C.cuts={};C.flags={};S.msg=null;render();break;}
    case 'cmnext':cmAdvance();break;
    case 'spw':onSpW(+b.dataset.i);break;
    case 'spopt':onSpOpt(+b.dataset.k);break;
    case 'sphint':onSpHint();break;
    case 'spnext':spAdvance();break;
    case 'again':S=newState();render();toTop();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#toc').hidden)toggleToc(false);
    else if(S.sp&&S.sp.menu){S.sp.menu=false;render();}
    return;
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey
     &&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    e.preventDefault();slideStep(e.key==='ArrowRight'?1:-1);
  }
});

S=newState();
render();
})();
</script>
