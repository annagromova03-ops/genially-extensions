<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Экранный эффект</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:none;}

  @keyframes glareDrift{
    0%,100%{ transform:translate(0,0) scale(1); opacity:0.55; }
    50%{ transform:translate(6vmin,-4vmin) scale(1.15); opacity:0.85; }
  }
  @keyframes fogDrift{
    0%,100%{ transform:translate(0,0) scale(1); opacity:0.45; }
    50%{ transform:translate(5vmin,-3vmin) scale(1.25); opacity:0.8; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'sparkles';
const opacityPct = Math.max(5, Math.min(100, parseInt(params.get('opacity')||'85',10)));
const density = Math.max(0, Math.min(100, parseInt(params.get('density')||'50',10)));
document.getElementById('stage').style.opacity = opacityPct/100;
const svgNS = 'http://www.w3.org/2000/svg';

function initCanvas(){
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  return ctx;
}

// ---- 1. Трескающийся экран ----
function startCrack(){
  document.getElementById('stage').insertAdjacentHTML('beforeend',
    `<svg id="crackSvg" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;"></svg>`);
  const svg = document.getElementById('crackSvg');
  const maxLines = 45;

  function spawnCrack(){
    const cx = 15+Math.random()*70, cy = 15+Math.random()*70;
    const mainLines = 5+Math.floor(Math.random()*3);
    for (let i=0;i<mainLines;i++){
      const angle = (Math.PI*2/mainLines)*i + Math.random()*0.5;
      const segs = 3+Math.floor(Math.random()*3);
      const segLen = (18+Math.random()*20)/segs;
      let x=cx, y=cy, a=angle;
      let d = `M ${x.toFixed(1)} ${y.toFixed(1)}`;
      for (let s=0;s<segs;s++){
        a += (Math.random()*0.5-0.25);
        x += Math.cos(a)*segLen; y += Math.sin(a)*segLen;
        d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
      const path = document.createElementNS(svgNS,'path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', '#f2f7ff');
      path.setAttribute('stroke-width', '0.55');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.style.filter = 'drop-shadow(0 0 1.2px rgba(255,255,255,0.95))';
      svg.appendChild(path);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      requestAnimationFrame(()=>{
        path.style.transition = `stroke-dashoffset ${0.25+Math.random()*0.3}s ease-out`;
        path.style.strokeDashoffset = '0';
      });
    }
    const impact = document.createElementNS(svgNS,'circle');
    impact.setAttribute('cx',cx); impact.setAttribute('cy',cy); impact.setAttribute('r','1.2');
    impact.setAttribute('fill','#fff');
    impact.style.opacity = '0.9';
    impact.style.transition = 'opacity .6s ease, r .6s ease';
    svg.appendChild(impact);
    requestAnimationFrame(()=>{ impact.style.opacity='0'; impact.setAttribute('r','6'); });
    setTimeout(()=>impact.remove(), 700);
  }
  spawnCrack();
  (function loop(){
    if (svg.querySelectorAll('path').length >= maxLines) return;
    const base = 10000 - density*65;
    setTimeout(()=>{ spawnCrack(); loop(); }, base*0.5+Math.random()*base*0.5);
  })();
}

// ---- 2. Помехи ----
function startStatic(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  const scale = 5;
  const alpha = 0.15 + density/100*0.55;
  function resizeOff(){ off.width = Math.max(1, Math.ceil(canvas.width/scale)); off.height = Math.max(1, Math.ceil(canvas.height/scale)); }
  resizeOff();
  window.addEventListener('resize', resizeOff);
  function tick(){
    const id = octx.createImageData(off.width, off.height);
    for (let i=0;i<id.data.length;i+=4){
      const v = Math.random()*255;
      id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=255;
    }
    octx.putImageData(id,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = alpha;
    ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.035){
      const y = Math.random()*canvas.height;
      const h = 4+Math.random()*18;
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = Math.random()<0.5 ? '#8be9fd' : '#ff6fa5';
      ctx.fillRect(0, y, canvas.width, h);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 3. Расплытие (туман/дымка — реальный блюр слайда позади overlay недоступен по той же причине, что и тряска) ----
function startBlur(){
  const stage = document.getElementById('stage');
  const count = 4 + Math.round(density/20);
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    const size = 42+Math.random()*38;
    el.style.cssText = `position:absolute;width:${size}vmin;height:${size}vmin;border-radius:50%;
      left:${Math.random()*70-10}%; top:${Math.random()*70-10}%;
      background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
      filter:blur(18px);
      animation: fogDrift ${20+Math.random()*16}s ease-in-out infinite; animation-delay:-${Math.random()*14}s;`;
    stage.appendChild(el);
  }
}

// ---- 4. Блики ----
function startGlare(){
  const stage = document.getElementById('stage');
  const count = 3 + Math.round(density/25);
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    const size = 14+Math.random()*18;
    el.style.cssText = `position:absolute;width:${size}vmin;height:${size}vmin;border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%);
      left:${Math.random()*80}%; top:${Math.random()*75}%; mix-blend-mode:screen;
      animation: glareDrift ${16+Math.random()*14}s ease-in-out infinite; animation-delay:-${Math.random()*10}s;`;
    stage.appendChild(el);
  }
  const sweep = document.createElement('div');
  sweep.style.cssText = `position:absolute;top:-60%;left:-60%;width:35%;height:220%;
    background:linear-gradient(75deg, transparent 40%, rgba(255,255,255,0.55) 50%, transparent 60%);
    mix-blend-mode:screen;`;
  stage.appendChild(sweep);
  function doSweep(){
    sweep.style.transition='none'; sweep.style.left='-60%';
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        sweep.style.transition = 'left 1.1s ease-in-out';
        sweep.style.left = '120%';
      });
    });
    const base = 9000 - density*55;
    setTimeout(doSweep, base*0.5+Math.random()*base*0.5);
  }
  doSweep();
}

// ---- 5. Вспышки ----
function startFlash(){
  document.getElementById('stage').insertAdjacentHTML('beforeend',
    `<div id="pureFlash" style="position:absolute;inset:0;background:radial-gradient(circle, rgba(255,250,230,0.95), rgba(255,250,230,0.15) 70%);opacity:0;"></div>`);
  const el = document.getElementById('pureFlash');
  function flash(){
    el.style.transition='none'; el.style.opacity='1';
    setTimeout(()=>{ el.style.transition='opacity .25s ease'; el.style.opacity='0'; }, 70);
    const base = 7000 - density*55;
    setTimeout(flash, base*0.3+Math.random()*base*0.7);
  }
  flash();
}

// ---- 6. Магические звёздочки ----
function startSparkles(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(12 + density*0.9);
  const stars = Array.from({length:count}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: 1.4+Math.random()*2.4, phase: Math.random()*Math.PI*2,
    speed: 0.15+Math.random()*0.3, drift: (Math.random()*2-1)*0.3,
    color: Math.random()<0.5 ? '255,245,200' : '210,225,255'
  }));
  function drawStar(x,y,r,alpha,color){
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `rgba(${color},1)`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = alpha*0.7;
    ctx.strokeStyle = `rgba(${color},1)`;
    ctx.lineWidth = Math.max(0.5, r*0.35);
    ctx.beginPath();
    ctx.moveTo(x-r*2.4,y); ctx.lineTo(x+r*2.4,y);
    ctx.moveTo(x,y-r*2.4); ctx.lineTo(x,y+r*2.4);
    ctx.stroke();
  }
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.y -= s.speed; s.x += s.drift + Math.sin(t*0.0007+s.phase)*0.3;
      if (s.y < -10){ s.y = canvas.height+10; s.x = Math.random()*canvas.width; }
      if (s.x < -10) s.x = canvas.width+10;
      if (s.x > canvas.width+10) s.x = -10;
      const twinkle = 0.35 + 0.5*(0.5+0.5*Math.sin(t*0.003 + s.phase*3));
      drawStar(s.x, s.y, s.r, twinkle, s.color);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

const renderers = {
  crack: startCrack, static: startStatic, blur: startBlur,
  glare: startGlare, flash: startFlash, sparkles: startSparkles
};
(renderers[type] || startSparkles)();
</script>
</body>
</html>
