<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Праздничный эффект</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:none;}
  @keyframes bulbTwinkle{ 0%,100%{opacity:0.4;transform:scale(0.85);} 50%{opacity:1;transform:scale(1.15);} }
  .trophy-icon{position:absolute;left:50%;top:48%;font-size:14vmin;transform:translate(-50%,-50%) scale(0.2);opacity:0;}
  .trophy-burst{
    position:absolute;left:50%;top:48%;width:50vmin;height:50vmin;transform:translate(-50%,-50%) scale(0.3) rotate(0deg);opacity:0;
    background:repeating-conic-gradient(from 0deg, rgba(255,214,90,0.6) 0deg 8deg, transparent 8deg 26deg);
    border-radius:50%;
    -webkit-mask-image:radial-gradient(circle, #000 20%, transparent 55%);
    mask-image:radial-gradient(circle, #000 20%, transparent 55%);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'confetti';
const opacityPct = Math.max(5, Math.min(100, parseInt(params.get('opacity')||'85',10)));
const density = Math.max(0, Math.min(100, parseInt(params.get('density')||'50',10)));
document.getElementById('stage').style.opacity = opacityPct/100;

function initCanvas(){
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  return ctx;
}

// ---- 1. Конфетти ----
function startConfetti(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let pieces = [];
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff'];
  function burst(){
    const n = 30+Math.round(density*0.5);
    for (let i=0;i<n;i++){
      pieces.push({
        x: Math.random()*canvas.width, y: -20-Math.random()*100,
        vx:(Math.random()*2-1)*1.5, vy:2+Math.random()*2.5,
        size:4+Math.random()*4, rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()*2-1)*0.15,
        color: colors[Math.floor(Math.random()*colors.length)], life:1
      });
    }
    setTimeout(burst, 6000 - density*30 + Math.random()*4000);
  }
  burst();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces = pieces.filter(p=>p.life>0);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.rot+=p.rotSpeed; p.life -= 0.0028;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2*0.6,p.size,p.size*0.6);
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 2. Салют ----
function startFireworks(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let particles = [];
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff','#ff9d4d'];
  function explode(){
    const cx = canvas.width*(0.2+Math.random()*0.6), cy = canvas.height*(0.2+Math.random()*0.4);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const n = 26+Math.round(density*0.3);
    for (let i=0;i<n;i++){
      const a = (Math.PI*2/n)*i + Math.random()*0.2;
      const speed = 1.5+Math.random()*2.5;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color,life:1});
    }
    setTimeout(explode, 3500 - density*18 + Math.random()*3000);
  }
  explode();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.035; p.vx*=0.985; p.life-=0.014;
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 3. Взлетающие звёзды ----
function startStarsUp(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let stars = [];
  function spawn(){
    stars.push({x:canvas.width*(0.15+Math.random()*0.7), y:canvas.height+10, vy:1.6+Math.random()*1.2, phase:Math.random()*Math.PI*2, life:1, size:10+Math.random()*8});
    setTimeout(spawn, 1200 - density*8 + Math.random()*1200);
  }
  spawn();
  function drawStar(x,y,r){
    ctx.beginPath();
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + i*(Math.PI*2/5);
      const xx = x+Math.cos(a)*r, yy = y+Math.sin(a)*r;
      i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
      const a2 = a+Math.PI/5;
      ctx.lineTo(x+Math.cos(a2)*r*0.45, y+Math.sin(a2)*r*0.45);
    }
    ctx.closePath(); ctx.fill();
  }
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars = stars.filter(s=>s.life>0);
    stars.forEach(s=>{
      s.y -= s.vy; s.life -= 0.006;
      const x = s.x + Math.sin(t*0.002+s.phase)*8;
      ctx.globalAlpha = Math.max(0,s.life);
      ctx.fillStyle = '#ffd166';
      drawStar(x, s.y, s.size);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 4. Гирлянда огоньков ----
function startLights(){
  const stage = document.getElementById('stage');
  const count = 10+Math.round(density/8);
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff'];
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    const x = (i+0.5)/count*100;
    const y = 4 + Math.sin(i*0.8)*3;
    const color = colors[i%colors.length];
    el.style.cssText = `position:absolute;left:${x}%;top:${y}%;width:2.2vmin;height:2.2vmin;border-radius:50%;
      background:${color}; box-shadow:0 0 1.5vmin ${color};
      animation: bulbTwinkle ${1.2+Math.random()*1.6}s ease-in-out infinite; animation-delay:-${Math.random()*3}s;`;
    stage.appendChild(el);
  }
}

// ---- 5. Воздушные шарики ----
function startBalloons(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff','#ff9d4d'];
  const count = Math.round(6+density*0.25);
  const balloons = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:canvas.height+Math.random()*200,
    w:22+Math.random()*14, speed:0.4+Math.random()*0.5, phase:Math.random()*Math.PI*2,
    color: colors[Math.floor(Math.random()*colors.length)]
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    balloons.forEach(b=>{
      b.y -= b.speed;
      const x = b.x + Math.sin(t*0.0008+b.phase)*12;
      const h = b.w*1.2;
      if (b.y < -h*2){ b.y = canvas.height+40; b.x = Math.random()*canvas.width; }
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(x,b.y,b.w*0.5,h*0.5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(x-b.w*0.18,b.y-h*0.18,b.w*0.14,h*0.18,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.moveTo(x-3,b.y+h*0.48); ctx.lineTo(x+3,b.y+h*0.48); ctx.lineTo(x,b.y+h*0.48+6); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x,b.y+h*0.48+6); ctx.lineTo(x+Math.sin(t*0.002+b.phase)*4, b.y+h*0.48+34); ctx.stroke();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 6. Серпантин ----
function startStreamers(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let pieces = [];
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff'];
  function burst(){
    const n = 8+Math.round(density*0.12);
    const originX = canvas.width*(0.2+Math.random()*0.6);
    for (let i=0;i<n;i++){
      pieces.push({
        x: originX, y: canvas.height*0.9,
        vx:(Math.random()*2-1)*3, vy:-(5+Math.random()*4),
        color: colors[Math.floor(Math.random()*colors.length)],
        curl: Math.random()*Math.PI*2, curlSpeed:0.15+Math.random()*0.1,
        life:1, len: 20+Math.random()*20
      });
    }
    setTimeout(burst, 6000 - density*30 + Math.random()*4000);
  }
  burst();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces = pieces.filter(p=>p.life>0);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.curl+=p.curlSpeed; p.life-=0.006;
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.beginPath();
      for (let s=0;s<=8;s++){
        const tt = s/8;
        const xx = p.x - p.vx*tt*3 + Math.sin(p.curl + tt*6)*6;
        const yy = p.y - p.vy*tt*3 + tt*p.len*0.3;
        s===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
      }
      ctx.stroke();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 7. Дождь из эмодзи-реакций ----
function startEmojiRain(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const emojis = ['❤️','👍','😍','🎉','⭐'];
  const count = Math.round(10+density*0.5);
  const items = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    size:16+Math.random()*14, speed:0.6+Math.random()*1, phase:Math.random()*Math.PI*2,
    emoji: emojis[Math.floor(Math.random()*emojis.length)]
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    items.forEach(it=>{
      it.y += it.speed; it.x += Math.sin(t*0.001+it.phase)*0.8;
      if (it.y - it.size > canvas.height){ it.y=-it.size; it.x=Math.random()*canvas.width; it.emoji = emojis[Math.floor(Math.random()*emojis.length)]; }
      ctx.font = it.size+'px sans-serif';
      ctx.fillText(it.emoji, it.x, it.y);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 8. Бенгальские огни ----
function startSparklers(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let sparks = [];
  const origins = [ {x:canvas.width*0.25,y:canvas.height*0.85}, {x:canvas.width*0.75,y:canvas.height*0.85} ];
  const chance = 0.15 + density*0.006;
  function tick(){
    origins.forEach(o=>{
      if (Math.random() < chance){
        const a = -Math.PI/2 + (Math.random()*2-1)*1.1;
        const speed = 1+Math.random()*2.5;
        sparks.push({x:o.x,y:o.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1});
      }
    });
    ctx.clearRect(0,0,canvas.width,canvas.height);
    sparks = sparks.filter(s=>s.life>0);
    sparks.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=0.02;
      ctx.globalAlpha = Math.max(0,s.life);
      ctx.fillStyle = Math.random()<0.5 ? '#ffe9a8' : '#fff3d6';
      ctx.beginPath(); ctx.arc(s.x,s.y,1.4,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 9. Кубок/медаль с сиянием ----
function startTrophy(){
  const stage = document.getElementById('stage');
  stage.insertAdjacentHTML('beforeend', `
    <div class="trophy-burst" id="trophyBurst"></div>
    <div class="trophy-icon" id="trophyIcon">🏆</div>`);
  const burstEl = document.getElementById('trophyBurst');
  const icon = document.getElementById('trophyIcon');
  function show(){
    icon.textContent = Math.random()<0.5 ? '🏆' : '🏅';
    burstEl.style.transition = 'none'; burstEl.style.opacity = '0'; burstEl.style.transform = 'translate(-50%,-50%) scale(0.3) rotate(0deg)';
    icon.style.transition = 'none'; icon.style.opacity = '0'; icon.style.transform = 'translate(-50%,-50%) scale(0.2)';
    requestAnimationFrame(()=>{
      burstEl.style.transition = 'opacity .5s ease, transform 1.6s ease-out';
      burstEl.style.opacity = '0.9'; burstEl.style.transform = 'translate(-50%,-50%) scale(1.4) rotate(50deg)';
      icon.style.transition = 'opacity .4s ease, transform .5s cubic-bezier(.34,1.56,.64,1)';
      icon.style.opacity = '1'; icon.style.transform = 'translate(-50%,-50%) scale(1)';
    });
    setTimeout(()=>{
      burstEl.style.transition = 'opacity .6s ease'; burstEl.style.opacity = '0';
      icon.style.transition = 'opacity .6s ease, transform .6s ease'; icon.style.opacity = '0'; icon.style.transform = 'translate(-50%,-50%) scale(0.7)';
    }, 2200);
    const base = 9000 - density*50;
    setTimeout(show, base*0.6+Math.random()*base*0.5);
  }
  show();
}

const renderers = {
  confetti: startConfetti, fireworks: startFireworks, starsup: startStarsUp, lights: startLights,
  balloons: startBalloons, streamers: startStreamers, emojirain: startEmojiRain,
  sparklers: startSparklers, trophy: startTrophy
};
(renderers[type] || startConfetti)();
</script>
</body>
</html>
