<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Праздничный эффект</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:none;}
  @keyframes bulbTwinkle{ 0%,100%{opacity:0.4;transform:scale(0.85);} 50%{opacity:1;transform:scale(1.15);} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'confetti';
const opacityPct = Math.max(5, Math.min(100, parseInt(params.get('opacity')||'85',10)));
const density = Math.max(0, Math.min(100, parseInt(params.get('density')||'50',10)));
document.getElementById('stage').style.opacity = opacityPct/100;

function initCanvas(){
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  return ctx;
}

// ---- 1. Конфетти ----
function startConfetti(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let pieces = [];
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff'];
  function burst(){
    const n = 30+Math.round(density*0.5);
    for (let i=0;i<n;i++){
      pieces.push({
        x: Math.random()*canvas.width, y: -20-Math.random()*100,
        vx:(Math.random()*2-1)*1.5, vy:2+Math.random()*2.5,
        size:4+Math.random()*4, rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()*2-1)*0.15,
        color: colors[Math.floor(Math.random()*colors.length)], life:1
      });
    }
    setTimeout(burst, 6000 - density*30 + Math.random()*4000);
  }
  burst();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces = pieces.filter(p=>p.life>0);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.rot+=p.rotSpeed; p.life -= 0.0028;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2*0.6,p.size,p.size*0.6);
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 2. Салют ----
function startFireworks(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let particles = [];
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff','#ff9d4d'];
  function explode(){
    const cx = canvas.width*(0.2+Math.random()*0.6), cy = canvas.height*(0.2+Math.random()*0.4);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const n = 26+Math.round(density*0.3);
    for (let i=0;i<n;i++){
      const a = (Math.PI*2/n)*i + Math.random()*0.2;
      const speed = 1.5+Math.random()*2.5;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color,life:1});
    }
    setTimeout(explode, 3500 - density*18 + Math.random()*3000);
  }
  explode();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.035; p.vx*=0.985; p.life-=0.014;
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 3. Взлетающие звёзды ----
function startStarsUp(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let stars = [];
  function spawn(){
    stars.push({x:canvas.width*(0.15+Math.random()*0.7), y:canvas.height+10, vy:1.6+Math.random()*1.2, phase:Math.random()*Math.PI*2, life:1, size:10+Math.random()*8});
    setTimeout(spawn, 1200 - density*8 + Math.random()*1200);
  }
  spawn();
  function drawStar(x,y,r){
    ctx.beginPath();
    for (let i=0;i<5;i++){
      const a = -Math.PI/2 + i*(Math.PI*2/5);
      const xx = x+Math.cos(a)*r, yy = y+Math.sin(a)*r;
      i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
      const a2 = a+Math.PI/5;
      ctx.lineTo(x+Math.cos(a2)*r*0.45, y+Math.sin(a2)*r*0.45);
    }
    ctx.closePath(); ctx.fill();
  }
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars = stars.filter(s=>s.life>0);
    stars.forEach(s=>{
      s.y -= s.vy; s.life -= 0.006;
      const x = s.x + Math.sin(t*0.002+s.phase)*8;
      ctx.globalAlpha = Math.max(0,s.life);
      ctx.fillStyle = '#ffd166';
      drawStar(x, s.y, s.size);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 4. Гирлянда огоньков ----
function startLights(){
  const stage = document.getElementById('stage');
  const count = 10+Math.round(density/8);
  const colors = ['#ff5b7a','#ffd166','#4fd8ff','#6bdc7e','#c07aff'];
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    const x = (i+0.5)/count*100;
    const y = 4 + Math.sin(i*0.8)*3;
    const color = colors[i%colors.length];
    el.style.cssText = `position:absolute;left:${x}%;top:${y}%;width:2.2vmin;height:2.2vmin;border-radius:50%;
      background:${color}; box-shadow:0 0 1.5vmin ${color};
      animation: bulbTwinkle ${1.2+Math.random()*1.6}s ease-in-out infinite; animation-delay:-${Math.random()*3}s;`;
    stage.appendChild(el);
  }
}

const renderers = {
  confetti: startConfetti, fireworks: startFireworks, starsup: startStarsUp, lights: startLights
};
(renderers[type] || startConfetti)();
</script>
</body>
</html>
