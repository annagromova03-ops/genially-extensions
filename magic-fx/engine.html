<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магический эффект</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:none;}

  .portal-wrap{position:absolute;left:50%;top:50%;width:50vmin;height:50vmin;transform:translate(-50%,-50%);}
  .portal-ring{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, transparent, rgba(150,80,255,0.7), transparent 40%, rgba(80,180,255,0.6), transparent 75%);
    -webkit-mask-image:radial-gradient(circle, transparent 55%, #000 60%, #000 68%, transparent 74%);
    mask-image:radial-gradient(circle, transparent 55%, #000 60%, #000 68%, transparent 74%);
    animation:portalSpin 6s linear infinite;
  }
  .portal-ring.r2{inset:8%; animation-duration:4s; animation-direction:reverse; opacity:0.8;}
  @keyframes portalSpin{ to{ transform:rotate(360deg); } }
  .portal-core{
    position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(150,80,255,0.4) 60%, transparent 80%);
    filter:blur(4px); animation:corePulse 2.5s ease-in-out infinite;
  }
  @keyframes corePulse{ 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.12);} }

  .scan-texture{position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, rgba(120,220,255,0.05) 0px, rgba(120,220,255,0.05) 1px, transparent 1px, transparent 3px);}
  .scan-line{position:absolute;left:0;right:0;height:8vh;top:-8vh;
    background:linear-gradient(180deg, transparent, rgba(120,220,255,0.55), transparent);}
  @keyframes scanMove{ from{transform:translateY(0);} to{ transform:translateY(116vh); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'fireflies';
const opacityPct = Math.max(5, Math.min(100, parseInt(params.get('opacity')||'85',10)));
const density = Math.max(0, Math.min(100, parseInt(params.get('density')||'50',10)));
document.getElementById('stage').style.opacity = opacityPct/100;
const svgNS = 'http://www.w3.org/2000/svg';

function initCanvas(){
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  return ctx;
}

// ---- 1. Портал-вихрь ----
function startPortal(){
  document.getElementById('stage').insertAdjacentHTML('beforeend', `
    <div class="portal-wrap">
      <div class="portal-ring r1"></div>
      <div class="portal-ring r2"></div>
      <div class="portal-core"></div>
    </div>`);
}

// ---- 2. Парящие руны ----
function startRunes(){
  const stage = document.getElementById('stage');
  const symbols = ['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᛟ','ᛝ','✦','◈'];
  const count = 4+Math.round(density/25);

  function cycle(el){
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left = (10+Math.random()*80)+'%';
    el.style.top = (10+Math.random()*75)+'%';
    el.style.transform = `rotate(${Math.random()*40-20}deg)`;
    const fadeIn = 0.8+Math.random()*0.6, hold = 1500+Math.random()*1500, fadeOut = 1+Math.random()*0.8;
    el.style.transition = `opacity ${fadeIn}s ease`;
    el.style.opacity = (0.7+Math.random()*0.3).toFixed(2);
    setTimeout(()=>{
      el.style.transition = `opacity ${fadeOut}s ease`;
      el.style.opacity = '0';
      setTimeout(()=>cycle(el), fadeOut*1000 + 300 + Math.random()*(6000-density*40));
    }, fadeIn*1000 + hold);
  }
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;font-size:${4+Math.random()*3}vmin;color:#c9a6ff;opacity:0;
      text-shadow:0 0 12px rgba(180,130,255,0.9), 0 0 24px rgba(180,130,255,0.6);`;
    stage.appendChild(el);
    setTimeout(()=>cycle(el), Math.random()*2000);
  }
}

// ---- 3. Магическая пыль со шлейфом ----
function startDust(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(6+density*0.35);
  const particles = Array.from({length:count},()=>({
    t: Math.random()*1000, speed:0.004+Math.random()*0.004,
    r: canvas.width*(0.15+Math.random()*0.25), cx:Math.random()*canvas.width, cy:Math.random()*canvas.height,
    trail:[]
  }));
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.t += p.speed;
      const x = p.cx + Math.cos(p.t)*p.r, y = p.cy + Math.sin(p.t*1.3)*p.r*0.6;
      p.trail.push({x,y}); if (p.trail.length>18) p.trail.shift();
      p.trail.forEach((pt,i)=>{
        ctx.globalAlpha = (i/p.trail.length)*0.6;
        ctx.fillStyle = '#ffe9a8';
        ctx.beginPath(); ctx.arc(pt.x,pt.y,2.2*(i/p.trail.length),0,Math.PI*2); ctx.fill();
      });
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 4. Светлячки ----
function startFireflies(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(10+density*0.6);
  const flies = Array.from({length:count},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    vx:(Math.random()*2-1)*0.3, vy:(Math.random()*2-1)*0.3, phase:Math.random()*Math.PI*2
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    flies.forEach(f=>{
      f.x+=f.vx; f.y+=f.vy;
      f.vx += (Math.random()-0.5)*0.05; f.vy += (Math.random()-0.5)*0.05;
      f.vx = Math.max(-0.6,Math.min(0.6,f.vx)); f.vy = Math.max(-0.6,Math.min(0.6,f.vy));
      if (f.x<0) f.x=canvas.width; if (f.x>canvas.width) f.x=0;
      if (f.y<0) f.y=canvas.height; if (f.y>canvas.height) f.y=0;
      const glow = 0.3+0.6*(0.5+0.5*Math.sin(t*0.0025+f.phase));
      ctx.globalAlpha = glow;
      ctx.fillStyle = '#e8ff8a';
      ctx.beginPath(); ctx.arc(f.x,f.y,2.2,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = glow*0.3;
      ctx.beginPath(); ctx.arc(f.x,f.y,6,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 5. Кольца заклинания ----
function startRings(){
  document.getElementById('stage').insertAdjacentHTML('beforeend',
    `<svg id="ringsSvg" viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%;"></svg>`);
  const svg = document.getElementById('ringsSvg');
  function spawnRing(){
    const circle = document.createElementNS(svgNS,'circle');
    circle.setAttribute('cx','50'); circle.setAttribute('cy','50'); circle.setAttribute('r','2');
    circle.setAttribute('fill','none'); circle.setAttribute('stroke','#b98cff'); circle.setAttribute('stroke-width','0.6');
    circle.style.opacity = '0.9';
    circle.style.transition = 'r 2.2s ease-out, opacity 2.2s ease-out, stroke-width 2.2s ease-out';
    svg.appendChild(circle);
    setTimeout(()=>{ circle.setAttribute('r','48'); circle.style.opacity='0'; circle.setAttribute('stroke-width','0.05'); }, 30);
    setTimeout(()=>circle.remove(), 2300);
    setTimeout(spawnRing, 1800 - density*10 + Math.random()*800);
  }
  spawnRing();
}

// ---- 6. Звёздное небо ----
function startStarfield(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const layers = [0.15,0.3,0.5].map(speed=>({
    speed,
    stars: Array.from({length: Math.round(20+density*0.5)}, ()=>({
      x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      r: 0.5+Math.random()*1.3, phase:Math.random()*Math.PI*2
    }))
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    layers.forEach(layer=>{
      layer.stars.forEach(s=>{
        s.x -= layer.speed*0.05;
        if (s.x<0) s.x = canvas.width;
        const tw = 0.4+0.5*(0.5+0.5*Math.sin(t*0.0015+s.phase));
        ctx.globalAlpha = tw;
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      });
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 7. Кометы ----
function startComets(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let comets = [];
  function spawn(){
    const fromLeft = Math.random()<0.5;
    comets.push({
      x: fromLeft?-30:canvas.width+30, y: Math.random()*canvas.height*0.6,
      vx:(fromLeft?1:-1)*(1.5+Math.random()), vy:0.6+Math.random()*0.5, len:70+Math.random()*40
    });
    setTimeout(spawn, 3000 - density*15 + Math.random()*3000);
  }
  spawn();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    comets = comets.filter(c=>c.x>-100 && c.x<canvas.width+100);
    comets.forEach(c=>{
      c.x+=c.vx; c.y+=c.vy;
      const mag = Math.hypot(c.vx,c.vy);
      const tx = c.x-c.vx/mag*c.len, ty = c.y-c.vy/mag*c.len;
      const grad = ctx.createLinearGradient(c.x,c.y,tx,ty);
      grad.addColorStop(0,'rgba(180,220,255,0.95)'); grad.addColorStop(1,'rgba(180,220,255,0)');
      ctx.strokeStyle=grad; ctx.lineWidth=2.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(c.x,c.y,2.5,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 8. Скан-линия голограммы ----
function startScanline(){
  document.getElementById('stage').insertAdjacentHTML('beforeend', `
    <div class="scan-texture"></div>
    <div class="scan-line" id="scanLine"></div>`);
  const dur = Math.max(1.4, 4.4 - density*0.028);
  document.getElementById('scanLine').style.animation = `scanMove ${dur}s linear infinite`;
}

const renderers = {
  portal: startPortal, runes: startRunes, dust: startDust, fireflies: startFireflies,
  rings: startRings, starfield: startStarfield, comets: startComets, scanline: startScanline
};
(renderers[type] || startFireflies)();
</script>
</body>
</html>
