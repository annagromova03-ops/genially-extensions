<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Составные уравнения — Экспедиция на дно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#06243a; --sea:#0b3d5c; --sea2:#11587f; --aqua:#3fd0d4; --aqua2:#a8f0ef; --aquaDark:#0b7d86;
  --coral:#ff7b5c; --coralDark:#b03a22; --sand:#ffe2a8; --gold:#ffc93c; --goldDark:#a86e00;
  --ok:#4fe08a; --okDark:#14753c; --bad:#ff6b7a; --badDark:#8f1d2b; --white:#f4fbff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--deep);font-family:'Rubik',Arial,sans-serif;color:var(--white);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;background:var(--deep)}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}
#screen{position:absolute;inset:0}
.abs{position:absolute}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.fade{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ---------- 3D cover title ---------- */
.t3d{position:relative;display:inline-block;font-weight:900;letter-spacing:2px;line-height:.98;text-align:center}
.t3d .back{position:absolute;inset:0;color:#0a3d63;-webkit-text-stroke:22px #0a3d63;text-shadow:0 10px 0 #072a45,0 18px 30px rgba(0,0,0,.45);z-index:0}
.t3d .mid{position:absolute;inset:0;color:#fff;-webkit-text-stroke:11px #fff;z-index:1}
.t3d .front{position:relative;z-index:2;background:linear-gradient(180deg,#d9fbff 0%,#6fe6f0 35%,#22b3d6 70%,#1478b8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t3d .shine{position:absolute;inset:0;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 38%);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(#ffe07a,#ffb72b);color:#5b3600;font-weight:900;font-size:30px;padding:10px 34px;border-radius:40px;
  border:5px solid #fff;box-shadow:0 7px 0 #a86e00,0 12px 24px rgba(0,0,0,.3)}
.bubble-deco{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 40%,rgba(255,255,255,.05) 70%);
  animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-120px);opacity:0}}

/* ---------- buttons ---------- */
.bub{height:84px;padding:0 46px;border-radius:44px;font-weight:900;font-size:32px;color:#fff;
  background:radial-gradient(circle at 30% 25%,#9ff4f6 0%,#3fd0d4 35%,#0b8ea0 100%);border:4px solid rgba(255,255,255,.9);
  box-shadow:0 7px 0 #075866,0 12px 22px rgba(0,0,0,.3);text-shadow:0 2px 0 #075866;transition:transform .12s}
.bub:hover{transform:translateY(-2px)} .bub:active{transform:translateY(5px);box-shadow:0 2px 0 #075866}
.bub.coral{background:radial-gradient(circle at 30% 25%,#ffc2ae 0%,#ff7b5c 40%,#d84b2b 100%);box-shadow:0 7px 0 var(--coralDark),0 12px 22px rgba(0,0,0,.3);text-shadow:0 2px 0 var(--coralDark)}
.bub.gold{background:radial-gradient(circle at 30% 25%,#fff3b8 0%,#ffc93c 40%,#e09a00 100%);color:#5b3600;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 7px 0 var(--goldDark),0 12px 22px rgba(0,0,0,.3)}
.bub.green{background:radial-gradient(circle at 30% 25%,#c4ffd9 0%,#4fe08a 40%,#1f9c55 100%);box-shadow:0 7px 0 var(--okDark),0 12px 22px rgba(0,0,0,.3);text-shadow:0 2px 0 var(--okDark)}
#tools{position:absolute;right:22px;top:20px;display:flex;gap:10px;z-index:40}
.tbtn{height:58px;min-width:58px;padding:0 20px;border-radius:30px;background:rgba(6,36,58,.75);border:3px solid var(--aqua2);font-weight:800;font-size:21px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.tbtn:active{transform:translateY(3px)}
.tbtn.arrow{font-size:26px;padding:0;width:58px}
.tbtn[disabled]{opacity:.35;pointer-events:none}

/* ---------- glass panel (diving log) ---------- */
.glass{position:absolute;border-radius:34px;background:linear-gradient(180deg,rgba(9,52,84,.86),rgba(5,30,50,.9));border:4px solid rgba(168,240,239,.85);
  box-shadow:0 0 0 6px rgba(63,208,212,.18),0 18px 40px rgba(0,0,0,.4),inset 0 0 50px rgba(63,208,212,.12);backdrop-filter:blur(8px);overflow:hidden}
.glass::before{content:'';position:absolute;left:24px;right:24px;top:10px;height:26px;border-radius:20px;background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.levelchip{position:absolute;left:24px;top:22px;z-index:20;display:flex;gap:12px;align-items:center}
.lvname{background:linear-gradient(#3fd0d4,#0b8ea0);border:3px solid #fff;border-radius:30px;padding:8px 26px;font-weight:900;font-size:30px;box-shadow:0 5px 0 #075866;text-shadow:0 2px 0 #075866}
.lvsub{background:rgba(6,36,58,.75);border:2px solid var(--aqua2);border-radius:20px;padding:6px 16px;font-weight:700;font-size:19px}
.speech{display:flex;gap:16px;align-items:flex-start;padding:22px 26px 14px}
.avatar{width:86px;height:86px;border-radius:50%;border:4px solid var(--gold);flex:none;box-shadow:0 4px 0 var(--goldDark);background-size:cover}
.say{flex:1;background:var(--white);color:#0b3d5c;border-radius:22px;padding:14px 20px;font-size:21px;font-weight:600;line-height:1.35;position:relative;min-height:70px}
.say::before{content:'';position:absolute;left:-16px;top:26px;border:9px solid transparent;border-right:12px solid var(--white)}
.say b{color:#c2410c}
.say .nm{display:block;font-size:15px;font-weight:900;color:var(--aquaDark);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.log{padding:6px 34px 0;display:flex;flex-direction:column;gap:6px}
.line{font-size:34px;font-weight:700;letter-spacing:.5px;white-space:pre;padding:4px 14px;border-radius:14px;display:block;line-height:1.5}
.line.given{font-size:38px;color:var(--gold);background:rgba(255,201,60,.1);border:2px dashed rgba(255,201,60,.5);text-align:center;margin-bottom:6px}
.line.done{color:var(--aqua2)}
.line.cur{background:rgba(63,208,212,.14)}
.line.chk{font-size:24px;color:var(--ok);white-space:normal}
.line.fin .ans{border-bottom:5px double var(--gold)}
.blank{vertical-align:middle;display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:56px;margin:0 6px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.95);
  color:#0b3d5c;border:4px solid var(--aqua);box-shadow:0 0 0 5px rgba(63,208,212,.3);font-weight:900}
.blank.op{min-width:62px;width:62px;padding:0}
.blank.wrong{border-color:var(--bad);background:#ffe1e4;animation:shake .4s}
.ans{color:#fff}
.input{padding:14px 34px 22px;display:flex;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(6,74px);gap:9px}
.key{height:60px;border-radius:30px;font-size:30px;font-weight:900;color:#0b3d5c;background:radial-gradient(circle at 30% 25%,#fff,#d9fbff 55%,#9fe3ea);border:3px solid #fff;box-shadow:0 5px 0 #4aa7b5}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #4aa7b5}
.key.del{background:radial-gradient(circle at 30% 25%,#fff,#ffe1d6 55%,#ffb7a1);box-shadow:0 5px 0 #c9705a}
.key.go{grid-column:1 / -1;font-size:26px;color:#fff;background:radial-gradient(circle at 30% 25%,#c4ffd9 0%,#4fe08a 40%,#1f9c55 100%);box-shadow:0 5px 0 var(--okDark);text-shadow:0 2px 0 var(--okDark)}
.ops{display:flex;gap:22px}
.opb{width:104px;height:104px;border-radius:50%;font-size:60px;font-weight:900;color:#0b3d5c;background:radial-gradient(circle at 30% 25%,#fff,#d9fbff 50%,#7fd7e3);
  border:4px solid #fff;box-shadow:0 7px 0 #4aa7b5,0 0 0 6px rgba(63,208,212,.25);line-height:1}
.opb:active{transform:translateY(4px)}
.opb.wrong{background:radial-gradient(circle at 30% 25%,#fff,#ffd0d6 50%,#ff8a97);animation:shake .4s}
.fbmsg{text-align:center;font-weight:800;font-size:22px;min-height:30px;margin-top:4px}
.fbmsg.ok{color:var(--ok)} .fbmsg.bad{color:var(--bad)}
.pearls{position:absolute;left:24px;bottom:20px;display:flex;gap:10px;align-items:center;z-index:20;background:rgba(6,36,58,.7);border:2px solid var(--aqua2);border-radius:30px;padding:8px 16px}
.pearl{width:40px;height:40px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:rgba(255,255,255,.7)}
.pearl.on{background:radial-gradient(circle at 32% 28%,#fff 0%,#f4f1ff 25%,#d9d0f5 60%,#a99bd6 100%);border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.8);color:transparent}
.pearl.cur{outline:3px solid var(--gold);outline-offset:3px}
.nextBtn{position:absolute;right:30px;bottom:24px;z-index:25}
.teach{position:absolute;left:24px;bottom:84px;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:620px}
.tnote{background:rgba(6,36,58,.92);color:#ffe9a8;border:2px dashed var(--gold);font-size:18px;font-weight:700;padding:7px 12px;border-radius:12px}
.tshow{background:var(--gold);color:#5b3600;font-weight:900;font-size:17px;padding:8px 14px;border-radius:12px;border:3px solid var(--goldDark)}

/* ---------- map ---------- */
.station{background:none;padding:0;position:absolute;display:flex;align-items:center;gap:18px;transition:transform .15s}
.station:hover{transform:translateX(6px)}
.port{width:118px;height:118px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#e8fdff,#7fe0e8 45%,#0b7d86);border:7px solid #d8b46a;
  box-shadow:0 0 0 5px #8a6a2a,0 10px 22px rgba(0,0,0,.45),inset 0 0 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.station.done .port::after{content:'✓';position:absolute;right:-10px;top:-10px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;font-weight:900;font-size:28px;
  display:flex;align-items:center;justify-content:center;border:3px solid #fff;font-family:'Rubik'}
.stinfo{background:rgba(6,36,58,.85);border:3px solid var(--aqua2);border-radius:24px;padding:12px 22px;text-align:left;min-width:420px;backdrop-filter:blur(6px)}
.stinfo .t{font-size:28px;font-weight:900}
.stinfo .s{font-size:19px;font-weight:600;color:var(--aqua2);margin-top:2px}
.stinfo .p{margin-top:8px;display:flex;gap:6px;align-items:center}
.mini{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.mini.on{background:radial-gradient(circle at 32% 28%,#fff,#d9d0f5 60%,#a99bd6);border-color:#fff}
.depth{position:absolute;font-weight:900;font-size:20px;color:var(--gold)}
.rope{position:absolute;left:146px;top:150px;width:6px;height:690px;background:repeating-linear-gradient(180deg,#d8b46a 0 14px,#8a6a2a 14px 18px);border-radius:3px}
.rankcard{position:absolute;right:50px;top:150px;width:420px;padding:26px;text-align:center}
.burst{position:absolute;pointer-events:none;font-size:42px;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.overlay{position:absolute;inset:0;background:rgba(3,20,34,.6);z-index:50;display:flex;align-items:center;justify-content:center}

/* ---------- briefing ---------- */
.layer{border-radius:26px;padding:14px 22px;display:inline-flex;flex-direction:column;align-items:center;gap:8px;font-size:30px;font-weight:800}
.fr-eq{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:8px 0 6px}
.fr-eq .tk{display:flex;flex-direction:column;align-items:center;gap:8px}
.fr-eq .v{font-size:40px;font-weight:800;padding:6px 10px;white-space:nowrap;line-height:1.1}
.fr-eq .box .v{border:4px dashed var(--gold);border-radius:18px;background:rgba(255,201,60,.16);color:var(--gold);padding:6px 16px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.0)}50%{box-shadow:0 0 0 8px rgba(255,201,60,.25)}}
.fr-eq .op .v{width:62px;height:62px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;font-size:44px;box-shadow:0 0 0 6px rgba(255,123,92,.3)}
.fr-eq .lab{font-size:16px;font-weight:700;color:var(--aqua2);text-align:center;max-width:170px;line-height:1.2}
.fr-eq .box .lab{color:var(--gold)} .fr-eq .op .lab{color:#ffb7a1}
.algo li{margin:10px 0;font-size:25px;font-weight:600;line-height:1.35}
.algo li b{color:var(--gold)}
</style>
</head>

<div id="stage"><div id="bg"></div><div id="screen"></div><div id="tools"></div></div>

const TEACHER=/[?&]teacher=1/.test(location.search);
const $=(s,r=document)=>r.querySelector(s);
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
const stage=$('#stage'), scr=$('#screen'), tools=$('#tools');
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900); stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit); fit(); stage.addEventListener('scroll',()=>{stage.scrollTop=0;});
const IMG=n=>`img/${n}.${n==='captain'?'png':'jpg'}`;
['cover','brief','reef','ship','cave','abyss','final','captain'].forEach(n=>{const i=new Image(); i.src=IMG(n);});
const setBg=n=>$('#bg').style.backgroundImage=`url(${IMG(n)})`;
function setTools(list){tools.innerHTML=''; list.forEach(b=>tools.appendChild(b));}
function tb(h,fn,c=''){const b=el('button','tbtn '+c,h); b.onclick=()=>{sTap(); fn();}; return b;}

/* sound */
let AC=null;
function tone(seq){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
 for(const [f,d,ty] of seq){const o=AC.createOscillator(),g=AC.createGain(); o.type=ty||'sine'; o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.75;}}catch(e){}}
const sTap=()=>tone([[880,.05]]), sOk=()=>tone([[660,.1],[880,.1],[1175,.2]]), sBad=()=>tone([[260,.15,'triangle'],[200,.2,'triangle']]),
      sWin=()=>tone([[523,.12],[659,.12],[784,.12],[1047,.35]]), sBlub=()=>tone([[300,.06],[420,.06],[560,.08]]);
function burst(x,y,set=['🫧','✨','🐚','💎','⭐']){for(let i=0;i<16;i++){const b=el('div','burst emo',set[i%set.length]); b.style.left=x+'px'; b.style.top=y+'px';
 const a=Math.random()*Math.PI*2,d=140+Math.random()*220; b.style.setProperty('--dx',Math.cos(a)*d+'px'); b.style.setProperty('--dy',Math.sin(a)*d-80+'px');
 b.style.setProperty('--r',(Math.random()*500-250)+'deg'); stage.appendChild(b); setTimeout(()=>b.remove(),1200);}}
function bubbles(n=14){let h=''; for(let i=0;i<n;i++){const s=10+Math.random()*34; h+=`<div class="bubble-deco" style="left:${Math.random()*1560}px;top:${200+Math.random()*700}px;width:${s}px;height:${s}px;animation-duration:${4+Math.random()*6}s;animation-delay:${-Math.random()*6}s"></div>`;} return h;}
const fmt=n=>{n=String(n).replace(/\D/g,''); return n.length>=5? n.replace(/\B(?=(\d{3})+(?!\d))/g,' ') : n;};
function chkText(T){ const rhs=T.eq.split(' = ').pop(); const v=T.chk[1]; return T.chk[0]+(/[+−·:]/.test(rhs)?` &nbsp;→&nbsp; ${v} = ${v}`:'')+' — верно!'; }
const AV=`<div class="avatar" style="background-image:url(${IMG('captain')})"></div>`;

const LV=[
 {id:'reef',name:'Коралловый риф',sub:'Выражение в правой части',rank:'Юнга',icon:'🐠',depth:'−10 м',col:[640,1570]},
 {id:'ship',name:'Затонувший корабль',sub:'Два действия',rank:'Дайвер',icon:'🚢',depth:'−50 м',col:[700,1570]},
 {id:'cave',name:'Подводная пещера',sub:'Два действия + выражение справа',rank:'Капитан',icon:'🦑',depth:'−200 м',col:[700,1570]},
 {id:'abyss',name:'Бездна',sub:'Скобка с двумя действиями',rank:'Мастер глубин',icon:'💎',depth:'−1000 м',col:[600,1570]},
];
const solved={}; LV.forEach(L=>solved[L.id]=new Set());
const levelDone=L=>solved[L.id].size>=TASKS[L.id].length;
function rank(){let r='Новичок'; LV.forEach(L=>{ if(levelDone(L)) r=L.rank; }); return r;}

/* ---------- COVER ---------- */
function title3d(text,size){return `<div class="t3d" style="font-size:${size}px"><div class="back">${text}</div><div class="mid">${text}</div><div class="front">${text}</div><div class="shine">${text}</div></div>`;}
function cover(){ setBg('cover'); setTools([]); scr.innerHTML=bubbles(18);
 const t=el('div','abs fade'); t.style.cssText='left:0;right:0;top:90px;text-align:center';
 t.innerHTML=`<div style="animation:bob 4s ease-in-out infinite">${title3d('СОСТАВНЫЕ<br>УРАВНЕНИЯ',128)}</div>
  <div style="margin-top:26px"><span class="badge">🐚 Петерсон · 3–4 класс</span></div>
  <div style="margin-top:22px;font-size:34px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.6)">Экспедиция на дно</div>`;
 const go=el('button','bub coral abs','Начать погружение'); go.style.cssText+='left:50%;top:640px;transform:translateX(-50%);font-size:36px;height:96px;padding:0 60px';
 go.onclick=()=>{sBlub(); depthMap();};
 const cr=el('div','abs','«Твой идеальный урок» · @ideallesson'); cr.style.cssText='right:22px;bottom:14px;font-size:18px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8)';
 scr.append(t,go,cr); }

/* ---------- DEPTH MAP ---------- */
function depthMap(){ setBg('cover'); scr.innerHTML='<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(6,36,58,.1),rgba(6,36,58,.75))"></div>'+bubbles(10);
 setTools([tb('🏠 Обложка',cover)]);
 const h=el('div','abs fade'); h.style.cssText='left:40px;top:26px'; h.innerHTML=title3d('Карта погружения',56); scr.appendChild(h);
 scr.appendChild(el('div','rope'));
 const items=[{icon:'🎓',name:'Брифинг у капитана',sub:'Объяснение: как решать составные уравнения',depth:'0 м',fn:()=>brief(0),done:briefSeen}].concat(
   LV.map((L,i)=>({icon:L.icon,name:L.name,sub:L.sub+': <b style="color:#fff;font-size:20px;white-space:nowrap">'+TASKS[L.id][0].eq+'</b>',depth:L.depth,fn:()=>dive(i,firstUnsolved(L)),done:levelDone(L),L})));
 items.forEach((it,i)=>{ const s=el('button','station fade'+(it.done?' done':''));
   s.style.left='90px'; s.style.top=(140+i*142)+'px';
   let pearls=''; if(it.L){ pearls='<div class="p">'+TASKS[it.L.id].map((_,k)=>`<div class="mini${solved[it.L.id].has(k)?' on':''}"></div>`).join('')+'</div>'; }
   s.innerHTML=`<div class="port"><span class="emo">${it.icon}</span></div><div class="stinfo"><div class="t">${it.name} <span style="color:var(--gold);font-size:20px">${it.depth}</span></div><div class="s">${it.sub}</div>${pearls}</div>`;
   s.onclick=()=>{sBlub(); it.fn();}; scr.appendChild(s); });
 const total=LV.reduce((n,L)=>n+solved[L.id].size,0), all=LV.reduce((n,L)=>n+TASKS[L.id].length,0);
 const rc=el('div','glass rankcard fade');
 rc.innerHTML=`<div style="display:flex;justify-content:center">${AV.replace('86px','120px')}</div><div style="font-size:22px;font-weight:700;margin-top:12px;color:var(--aqua2)">Твоё звание</div>
  <div style="font-size:44px;font-weight:900;color:var(--gold);margin:4px 0 14px">${rank()}</div>
  <div style="font-size:22px;font-weight:700">Жемчужин: <b style="color:#fff;font-size:30px">${total}</b> из ${all}</div>
  <div style="font-size:18px;color:var(--aqua2);margin-top:14px;line-height:1.4">Погружайся на любую глубину — выбирай уровень, который вы сейчас проходите.</div>`;
 scr.appendChild(rc);
 if(LV.every(levelDone)){ const f=el('button','bub gold abs','💰 Открыть сундук!'); f.style.cssText+='right:90px;top:640px'; f.onclick=finale; scr.appendChild(f); }
}
const firstUnsolved=L=>{const i=TASKS[L.id].findIndex((_,k)=>!solved[L.id].has(k)); return i<0?0:i;};

/* ---------- BRIEFING ---------- */
let briefSeen=false;
const EX1=TASKS.ship[2], EX2=TASKS.ship[0], EX3=TASKS.cave[0];
function framed(parts){ return '<div class="fr-eq">'+parts.map(p=>`<div class="tk ${p.c||''}"><div class="v">${p.t}</div>${p.l?`<div class="lab">${p.l}</div>`:''}</div>`).join('')+'</div>'; }
const FR={
 ex1:[{t:'x · 6',c:'box',l:'одно целое —<br>уменьшаемое'},{t:'−',c:'op',l:'последнее<br>действие'},{t:'956',l:'вычитаемое'},{t:'='},{t:'280',l:'разность'}],
 ex2:[{t:'(x + 15)',c:'box',l:'одно целое —<br>множитель'},{t:'·',c:'op',l:'последнее<br>действие'},{t:'4',l:'множитель'},{t:'='},{t:'100',l:'произведение'}],
 ex3:[{t:'x · 6',c:'box',l:'одно целое —<br>уменьшаемое'},{t:'−',c:'op',l:'последнее<br>действие'},{t:'956',l:'вычитаемое'},{t:'='},{t:'70 · 4',l:'разность<br>(сначала вычислим!)'}],
};
function layersHTML(){ // x · 6 − 956 = 280 as nested layers
 return `<div style="display:flex;justify-content:center;margin-top:10px">
  <div class="layer" style="background:rgba(63,208,212,.18);border:3px solid var(--aqua)"><span style="font-size:18px;color:var(--aqua2)">слой 1 (верхний) — вычитание</span>
   <div style="display:flex;align-items:center;gap:14px">
    <div class="layer" style="background:rgba(17,88,127,.7);border:3px solid #6fb7e0"><span style="font-size:18px;color:#bfe6ff">слой 2 — умножение</span>
      <div style="display:flex;align-items:center;gap:12px"><div class="layer" style="background:rgba(255,201,60,.2);border:3px solid var(--gold);padding:10px 22px"><span style="font-size:16px;color:var(--gold)">сокровище</span><span style="font-size:44px;color:var(--gold)">x</span></div><span>· 6</span></div>
    </div><span>− 956</span></div></div></div>
  <div style="text-align:center;font-size:30px;font-weight:800;margin-top:16px">= 280</div>`; }
function exampleSteps(T,shown,fr){ let h= fr? framed(FR[fr]) : `<div class="line given">${T.eq}</div>`;
 T.steps.slice(0,shown).forEach((s,i)=>{ h+=`<div class="line done fade" style="justify-content:flex-start">${s.pre}<span class="ans" style="color:#fff">${s.ans}</span>${s.post}</div>`; });
 if(shown===T.steps.length) h+=`<div class="line chk fade">✔ Проверка: ${chkText(T)}</div>`;
 return h; }
const BRIEF=[
 {say:'Привет, юнга! Я — <b>капитан Аква</b>. Сегодня мы научимся решать <b>составные уравнения</b>. В них неизвестное, как сокровище, спрятано на дне — под несколькими действиями.',
  html:()=>`<div style="font-size:25px;font-weight:700;text-align:center;line-height:1.4;margin-top:4px">Вот уравнение. Над x «плещется» два слоя воды — два действия:</div>${layersHTML()}`},
 {say:'Посмотри внимательно: всё, что стоит <b>до последнего действия</b>, — это <b>одно целое</b>. Обведём его рамкой! Тогда сразу видно: главное действие здесь — <b>вычитание</b>.',
  html:()=>`${framed(FR.ex1)}<div style="font-size:24px;font-weight:600;line-height:1.45;padding:14px 26px 0;text-align:center">
   Рамка <b style="color:var(--gold)">x · 6</b> — это одно число, которое мы пока не знаем.<br>
   Значит, перед нами простое уравнение на вычитание:<br>
   <span style="font-size:30px;font-weight:800"><span style="border:3px dashed var(--gold);border-radius:12px;padding:0 10px;color:var(--gold)">?</span> − 956 = 280</span><br>
   Неизвестно <b style="color:var(--gold)">уменьшаемое</b> → к разности прибавляем вычитаемое.</div>`},
 {say:'Главное правило ныряльщика: <b>сначала снимаем верхний слой</b> — то действие, которое при вычислении выполнялось бы <b>последним</b>.',
  html:()=>`${framed(FR.ex1)}<div style="font-size:24px;font-weight:600;line-height:1.5;padding:4px 20px">
   Если бы x был известен, мы считали бы так:<br>
   <span style="color:var(--aqua2)">1)</span> x · 6 &nbsp;&nbsp; <span style="color:var(--aqua2)">2)</span> … − 956<br>
   Последнее действие — <b style="color:var(--gold)">вычитание</b>. Значит, это верхний слой!<br><br>
   Всё, что стоит перед «− 956», — это <b style="color:var(--gold)">уменьшаемое</b>: <b>x · 6</b>.<br>
   Находим его по правилу: <i>к разности прибавляем вычитаемое</i>.</div>`},
 {fr:'ex1',say:'Смотри, как погружаемся по шагам. Каждый шаг — новая строчка: сначала записываем действие, а результат — <b>на следующей строке</b>.',ex:EX1},
 {fr:'ex2',say:'Если верхний слой — <b>скобка</b>, то неизвестным компонентом считаем <b>всю скобку целиком</b>.',ex:EX2},
 {fr:'ex3',say:'А если в правой части стоит выражение — <b>сначала вычисляем его</b>, а потом ныряем как обычно.',ex:EX3},
 {say:'Запомни памятку ныряльщика — и вперёд, на глубину!',
  html:()=>`<ol class="algo" style="padding:4px 30px 0 60px">
   <li>Если справа выражение — <b>вычисли его</b>.</li>
   <li>Найди <b>последнее действие</b> в левой части — это верхний слой.</li>
   <li>Назови <b>неизвестный компонент</b> (скобку — целиком!).</li>
   <li>Найди его <b>по правилу</b>: запиши действие, а результат — на новой строке.</li>
   <li>Повторяй, пока не доберёшься до <b>x</b>.</li>
   <li>Сделай <b>проверку</b>: подставь x в уравнение.</li></ol>`},
];
let exShown=0;
function brief(i){ briefSeen=true; setBg('brief'); scr.innerHTML=''; const B=BRIEF[i];
 setTools([tb('🗺️ Карта',depthMap), tb('◀',()=>{exShown=0; brief(i-1);},'arrow'), tb('▶',()=>nextBrief(i),'arrow')]); if(i===0) tools.children[1].disabled=true;
 const chip=el('div','levelchip',`<div class="lvname">Брифинг</div><div class="lvsub">${i+1} из ${BRIEF.length}</div>`); scr.appendChild(chip);
 const g=el('div','glass fade'); g.style.cssText+='left:740px;top:110px;width:830px;height:770px';
 g.innerHTML=`<div class="speech">${AV}<div class="say"><span class="nm">Капитан Аква</span><span id="bsay">${B.say}</span></div></div><div id="bbody" class="log"></div>`;
 scr.appendChild(g);
 const body=$('#bbody',g);
 if(B.ex){ const T=B.ex; const draw=()=>{ body.innerHTML=exampleSteps(T,exShown,B.fr);
     const s=T.steps[exShown-1]; if(s) $('#bsay',g).innerHTML=s.hint.replace(' Выбери знак действия.','');
     const btn=el('button','bub'+(exShown<T.steps.length?'':' green'), exShown<T.steps.length?'Следующий шаг ⬇':'Дальше ➜'); btn.style.cssText='height:66px;font-size:26px;align-self:center;margin-top:10px';
     btn.onclick=()=>{ sBlub(); if(exShown<T.steps.length){exShown++; draw();} else nextBrief(i); }; body.appendChild(btn); };
   draw(); }
 else { body.innerHTML=B.html(); const btn=el('button','bub'+(i===BRIEF.length-1?' coral':''), i===BRIEF.length-1?'К погружению! 🤿':'Дальше ➜'); btn.style.cssText='height:70px;font-size:28px;align-self:center;margin-top:18px'; btn.onclick=()=>{sBlub(); nextBrief(i);}; body.appendChild(btn); }
}
function nextBrief(i){ exShown=0; if(i>=BRIEF.length-1) depthMap(); else brief(i+1); }

/* ---------- DIVE ---------- */
let curL=0, curT=0, st=null;
function dive(li,ti=0){ curL=li; curT=ti; const L=LV[li], T=TASKS[L.id][ti]; setBg(L.id); scr.innerHTML='';
 setTools([tb('🗺️ Карта',depthMap), tb('◀',()=>go(-1),'arrow'), tb('▶',()=>go(1),'arrow')]); if(ti===0) tools.children[1].disabled=true;
 scr.appendChild(el('div','levelchip',`<div class="lvname">${L.icon} ${L.name}</div><div class="lvsub">${L.sub}</div>`));
 const pr=el('div','pearls'); TASKS[L.id].forEach((_,k)=>{const p=el('div','pearl'+(solved[L.id].has(k)?' on':'')+(k===ti?' cur':''),k+1); p.onclick=()=>{sTap(); dive(li,k);}; pr.appendChild(p);}); scr.appendChild(pr);
 const [x0,x1]=L.col; const g=el('div','glass fade'); g.style.cssText+=`left:${x0}px;top:96px;width:${x1-x0}px;height:786px`;
 g.innerHTML=`<div class="speech">${AV}<div class="say"><span class="nm">Капитан Аква</span><span id="say"></span></div></div><div class="log" id="log"></div><div class="input" id="inp"></div><div class="fbmsg" id="fb"></div>`;
 scr.appendChild(g);
 st={L,T,step:0,val:'',g,done:solved[L.id].has(ti)};
 if(st.done){ st.step=T.steps.length; }
 render();
 if(TEACHER){ const t=el('div','teach'); t.innerHTML=`<div class="tnote">🎓 Ответ: ${T.var} = ${T.x}</div>`;
   const b1=el('button','tshow','Решить шаг'); b1.onclick=()=>{ if(st.step<T.steps.length){ accept(); } };
   const b2=el('button','tshow','Всё решение'); b2.onclick=()=>{ while(st.step<T.steps.length) accept(true); finish(); };
   t.append(b1,b2); scr.appendChild(t); }
}
function render(){ const {T,g}=st; const log=$('#log',g), inp=$('#inp',g), say=$('#say',g);
 let h=`<div class="line given">${T.eq}</div>`;
 T.steps.forEach((s,i)=>{ if(i<st.step) h+=`<div class="line done${i===T.steps.length-1?' fin':''}">${s.pre}<span class="ans">${s.ans}</span>${s.post}</div>`;
   else if(i===st.step) h+=`<div class="line cur fade">${s.pre}<span class="blank${s.blank==='op'?' op':''}" id="bl">${s.blank==='op'?'?':(st.val?fmt(st.val):'')}</span>${s.post}</div>`; });
 if(st.step>=T.steps.length) h+=`<div class="line chk fade">✔ Проверка: ${chkText(T)}</div>`;
 log.innerHTML=h;
 const n=T.steps.length; log.style.gap = n>=6? '2px':'6px'; [...log.querySelectorAll('.line:not(.given):not(.chk)')].forEach(l=>l.style.fontSize= n>=6?'30px':'34px');
 inp.innerHTML='';
 if(st.step>=T.steps.length){ say.innerHTML= st.justWon? `Отлично! ${T.var} = <b>${T.x}</b>. Проверка сошлась — жемчужина твоя! 🫧` : `Это уравнение уже решено: ${T.var} = <b>${T.x}</b>.`; addNext(); return; }
 const s=T.steps[st.step]; say.innerHTML=s.hint;
 if(s.blank==='op'){ const ops=el('div','ops'); ['+','−','·',':'].forEach(o=>{const b=el('button','opb',o); b.onclick=()=>pickOp(o,b); ops.appendChild(b);}); inp.appendChild(ops); }
 else { const kp=el('div','keypad'); '1234567890'.split('').forEach(d=>{const k=el('button','key',d); k.onclick=()=>{sTap(); type(d);}; kp.appendChild(k);});
   const del=el('button','key del','⌫'); del.onclick=()=>{sTap(); type('del');}; kp.appendChild(del);
   const ok=el('button','key go','Проверить'); ok.onclick=checkNum; kp.appendChild(ok); inp.appendChild(kp); }
}
function fb(msg,cls){ const f=$('#fb',st.g); f.className='fbmsg '+cls; f.textContent=msg; }
function type(d){ if(!st||st.step>=st.T.steps.length) return; const s=st.T.steps[st.step]; if(s.blank!=='n') return;
 if(d==='del') st.val=st.val.slice(0,-1); else if(st.val.length<7) st.val+=d; const b=$('#bl',st.g); b.textContent=fmt(st.val); b.classList.remove('wrong'); fb('',''); }
function checkNum(){ const s=st.T.steps[st.step]; if(!st.val){ fb('Впиши число!','bad'); return; }
 if(st.val===s.ans.replace(/\D/g,'')){ accept(); } else { sBad(); const b=$('#bl',st.g); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); fb('Пересчитай ещё раз — число не подходит.','bad'); } }
function pickOp(o,b){ const s=st.T.steps[st.step]; if(o===s.ans){ accept(); } else { sBad(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); fb('Не тот знак. Перечитай правило в подсказке капитана.','bad'); } }
function accept(silent){ st.step++; st.val=''; if(!silent){ sOk(); fb('Верно! Ныряем глубже 🫧','ok'); }
 if(st.step>=st.T.steps.length && !silent) return finish(); if(!silent) render(); }
function finish(){ const {L}=st; const first=!solved[L.id].has(curT); solved[L.id].add(curT); st.justWon=true; sWin();
 const r=st.g.getBoundingClientRect(), s=stage.getBoundingClientRect(), k=s.width/1600; burst((r.left-s.left)/k+(r.width/k)/2,(r.top-s.top)/k+300);
 render(); fb('Жемчужина найдена! 🦪','ok');
 const p=document.querySelectorAll('.pearl')[curT]; if(p) p.classList.add('on','pop');
 if(first && levelDone(L)){ const g=st.g; setTimeout(()=>{ if(document.body.contains(g)) rankUp(L); },900); } }
function addNext(){ const last=curT===TASKS[st.L.id].length-1; const b=el('button','bub green nextBtn pop', last?'К карте 🗺️':'Дальше ➜'); b.onclick=()=>{sBlub(); last?depthMap():go(1);}; st.g.appendChild(b); }
function go(d){ const n=curT+d, len=TASKS[LV[curL].id].length; if(n<0) return; if(n>=len) return depthMap(); dive(curL,n); }
function rankUp(L){ const ov=el('div','overlay'); const c=el('div','glass pop'); c.style.cssText+='position:relative;width:700px;padding:40px;text-align:center';
 c.innerHTML=`<div style="display:flex;justify-content:center">${AV.replace('86px','130px')}</div>
  <div style="margin-top:14px">${title3d('Новое звание!',52)}</div>
  <div style="font-size:50px;font-weight:900;color:var(--gold);margin-top:10px">${L.rank}</div>
  <div style="font-size:24px;font-weight:600;margin-top:10px">${L.name}: все жемчужины собраны!</div>`;
 const b=el('button','bub coral','Дальше 🤿'); b.style.marginTop='24px'; b.onclick=()=>{sBlub(); depthMap();}; c.appendChild(b); ov.appendChild(c); scr.appendChild(ov); sWin(); burst(800,300); burst(600,450); burst(1000,450); }

/* ---------- FINALE ---------- */
function finale(){ setBg('final'); setTools([tb('🗺️ Карта',depthMap)]); scr.innerHTML=bubbles(16);
 const t=el('div','abs pop'); t.style.cssText='left:0;right:0;top:40px;text-align:center';
 t.innerHTML=`${title3d('СОКРОВИЩЕ НАЙДЕНО!',84)}<div style="margin-top:20px"><span class="badge">🏅 ${rank()}</span></div>
   <div style="font-size:28px;font-weight:700;margin-top:18px;text-shadow:0 2px 8px rgba(0,0,0,.7)">Ты прошёл все глубины и научился решать составные уравнения!</div>`;
 const again=el('button','bub abs','Начать заново'); again.style.cssText+='right:60px;bottom:40px'; again.onclick=()=>{ LV.forEach(L=>solved[L.id]=new Set()); cover(); };
 scr.append(t,again); sWin(); setTimeout(()=>{burst(800,260,['💰','💎','🦪','✨','⭐']); burst(500,420); burst(1100,420);},200); }

addEventListener('keydown',e=>{
 if(st && $('#log') ){ if(/^[0-9]$/.test(e.key)) return type(e.key); if(e.key==='Backspace') return type('del');
   const s=st.T.steps[st.step]; if(s&&s.blank==='n'&&e.key==='Enter') return checkNum();
   if(s&&s.blank==='op'){ const m={'+':'+','-':'−','*':'·','/':':',':':':'}[e.key]; if(m){ const b=[...document.querySelectorAll('.opb')].find(x=>x.textContent===m); return pickOp(m,b);} } }
 if($('#log') && (e.key==='ArrowRight'||e.key==='ArrowLeft')) go(e.key==='ArrowRight'?1:-1);
});
cover();
</script>
</body>
</html>
