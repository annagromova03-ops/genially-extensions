<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Атмосферный эффект</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:none;}

  .film-vignette{position:absolute;inset:0;
    box-shadow:inset 0 0 12vmin 2vmin rgba(20,15,10,0.7);
    background:radial-gradient(circle, transparent 55%, rgba(30,20,10,0.35) 100%);}
  .film-flicker{position:absolute;inset:0;background:#000;opacity:0;}

  .light-beam{position:absolute;top:-20%;left:20%;width:35%;height:140%;
    background:linear-gradient(100deg, transparent 30%, rgba(255,240,200,0.18) 48%, rgba(255,240,200,0.28) 52%, transparent 70%);
    transform:skewX(-15deg);}

  @keyframes batFly{
    0%{transform:translate(0,0) scaleX(1);}
    25%{transform:translate(30vw,-6vh) scaleX(-1);}
    50%{transform:translate(60vw,4vh) scaleX(1);}
    75%{transform:translate(90vw,-8vh) scaleX(-1);}
    100%{transform:translate(120vw,0) scaleX(1);}
  }
  @keyframes rayShimmer{
    0%,100%{opacity:0.5; transform:skewX(-12deg) translateX(0);}
    50%{opacity:0.9; transform:skewX(-6deg) translateX(2vw);}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'bubbles';
const opacityPct = Math.max(5, Math.min(100, parseInt(params.get('opacity')||'85',10)));
const density = Math.max(0, Math.min(100, parseInt(params.get('density')||'50',10)));
document.getElementById('stage').style.opacity = opacityPct/100;
const svgNS = 'http://www.w3.org/2000/svg';

function initCanvas(){
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  return ctx;
}

// ---- 1. Старое кино ----
function startOldFilm(){
  const stage = document.getElementById('stage');
  stage.insertAdjacentHTML('beforeend', `<div class="film-vignette"></div><div class="film-flicker" id="filmFlicker"></div>`);
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const off = document.createElement('canvas'); const octx = off.getContext('2d');
  const scale = 4;
  function resizeOff(){ off.width = Math.max(1, Math.ceil(canvas.width/scale)); off.height = Math.max(1, Math.ceil(canvas.height/scale)); }
  resizeOff();
  window.addEventListener('resize', resizeOff);
  const alpha = 0.08+density/100*0.14;
  function tick(){
    const id = octx.createImageData(off.width, off.height);
    for (let i=0;i<id.data.length;i+=4){ const v=Math.random()*255; id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v;id.data[i+3]=255; }
    octx.putImageData(id,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled = false; ctx.globalAlpha = alpha;
    ctx.drawImage(off,0,0,canvas.width,canvas.height);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  const flicker = document.getElementById('filmFlicker');
  (function doFlicker(){
    flicker.style.transition = 'none';
    flicker.style.opacity = (Math.random()*0.15).toFixed(2);
    setTimeout(doFlicker, 80+Math.random()*160);
  })();
}

// ---- 2. Дождь по стеклу ----
function startGlassRain(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(14+density*0.5);
  const drops = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    r:2+Math.random()*3, speed:0.3+Math.random()*0.7, wob:Math.random()*Math.PI*2
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drops.forEach(d=>{
      const prevY = d.y;
      d.y += d.speed; d.x += Math.sin(t*0.001+d.wob)*0.1;
      if (d.y - d.r > canvas.height){ d.y=-10; d.x=Math.random()*canvas.width; }
      ctx.strokeStyle='rgba(210,230,245,0.35)'; ctx.lineWidth=d.r*0.7;
      ctx.beginPath(); ctx.moveTo(d.x,prevY-6); ctx.lineTo(d.x,d.y); ctx.stroke();
      ctx.fillStyle='rgba(220,235,248,0.65)';
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 3. Пылинки в луче света ----
function startDustBeam(){
  const stage = document.getElementById('stage');
  stage.insertAdjacentHTML('beforeend', `<div class="light-beam"></div>`);
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(20+density*0.6);
  const motes = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    speed:0.15+Math.random()*0.25, phase:Math.random()*Math.PI*2, r:0.8+Math.random()*1.4
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    motes.forEach(m=>{
      m.y -= m.speed; m.x += Math.sin(t*0.0008+m.phase)*0.25;
      if (m.y<-10) m.y = canvas.height+10;
      const tw = 0.3+0.5*(0.5+0.5*Math.sin(t*0.002+m.phase));
      ctx.globalAlpha = tw;
      ctx.fillStyle = '#fff3d6';
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 4. Летучие мыши / паутина ----
function cobwebSvg(flip){
  return `<svg viewBox="0 0 60 60" style="position:absolute;${flip?'right':'left'}:0;top:0;width:16vmin;height:16vmin;${flip?'transform:scaleX(-1);':''}">
    <g stroke="rgba(230,230,240,0.55)" stroke-width="0.6" fill="none">
      <path d="M0,0 L60,0 M0,0 L0,60 M0,0 L60,60 M0,0 L20,60 M0,0 L60,20"/>
      <path d="M4,0 Q4,4 0,4 M12,0 Q12,10 0,10 M22,0 Q20,18 0,18 M0,0 Q10,10 20,4 M0,0 Q16,20 8,30"/>
    </g>
  </svg>`;
}
function startBats(){
  const stage = document.getElementById('stage');
  stage.insertAdjacentHTML('beforeend', cobwebSvg(false)+cobwebSvg(true));
  const count = 2+Math.round(density/35);
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    el.textContent = '🦇';
    el.style.cssText = `position:absolute;font-size:${3+Math.random()*2}vmin;top:${10+Math.random()*50}%;left:-10%;
      animation: batFly ${8+Math.random()*8}s linear infinite; animation-delay:-${Math.random()*10}s;`;
    stage.appendChild(el);
  }
}

// ---- 5. Пузыри ----
function startBubbles(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(10+density*0.5);
  const bubbles = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:canvas.height+Math.random()*100,
    r:4+Math.random()*10, speed:0.4+Math.random()*0.8, phase:Math.random()*Math.PI*2
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    bubbles.forEach(b=>{
      b.y -= b.speed; b.x += Math.sin(t*0.001+b.phase)*0.6;
      if (b.y+b.r<0){ b.y=canvas.height+20; b.x=Math.random()*canvas.width; }
      ctx.strokeStyle='rgba(220,245,255,0.55)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(220,245,255,0.12)';
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.2,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ---- 6. Подводные лучи света ----
function startUnderwaterRays(){
  const stage = document.getElementById('stage');
  const count = 4+Math.round(density/25);
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    const w = 8+Math.random()*10;
    el.style.cssText = `position:absolute;top:-10%;left:${Math.random()*90}%;width:${w}vmin;height:130%;
      background:linear-gradient(180deg, rgba(160,230,255,0.28), transparent 75%);
      transform:skewX(-12deg);
      animation: rayShimmer ${6+Math.random()*5}s ease-in-out infinite; animation-delay:-${Math.random()*5}s;`;
    stage.appendChild(el);
  }
}

// ---- 7. Рябь на воде ----
function startRipple(){
  document.getElementById('stage').insertAdjacentHTML('beforeend',
    `<svg id="rippleSvg" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;"></svg>`);
  const svg = document.getElementById('rippleSvg');
  function spawn(){
    const cx = 10+Math.random()*80, cy = 10+Math.random()*80;
    const ellipse = document.createElementNS(svgNS,'ellipse');
    ellipse.setAttribute('cx',cx); ellipse.setAttribute('cy',cy);
    ellipse.setAttribute('rx','1'); ellipse.setAttribute('ry','0.4');
    ellipse.setAttribute('fill','none'); ellipse.setAttribute('stroke','rgba(210,240,255,0.7)'); ellipse.setAttribute('stroke-width','0.4');
    ellipse.style.transition = 'rx 2.4s ease-out, ry 2.4s ease-out, opacity 2.4s ease-out';
    svg.appendChild(ellipse);
    setTimeout(()=>{ ellipse.setAttribute('rx','14'); ellipse.setAttribute('ry','5.5'); ellipse.style.opacity='0'; }, 30);
    setTimeout(()=>ellipse.remove(), 2500);
    setTimeout(spawn, 1400 - density*8 + Math.random()*1200);
  }
  spawn();
}

const renderers = {
  oldfilm: startOldFilm, glassrain: startGlassRain, dustbeam: startDustBeam, bats: startBats,
  bubbles: startBubbles, underwaterrays: startUnderwaterRays, ripple: startRipple
};
(renderers[type] || startBubbles)();
</script>
</body>
</html>
