<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Природное явление</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;overflow:hidden;}
  #canvas{position:absolute;inset:0;width:100%;height:100%;display:none;}

  .rays-wrap{position:absolute;left:50%;top:36%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);}
  .ray-layer{
    position:absolute;inset:0;border-radius:50%;
    -webkit-mask-image:radial-gradient(circle, #000 8%, transparent 42%);
    mask-image:radial-gradient(circle, #000 8%, transparent 42%);
  }
  .ray-layer.a{background:repeating-conic-gradient(from 0deg, rgba(255,232,150,0.55) 0deg 6deg, transparent 6deg 26deg); animation:spin 70s linear infinite;}
  .ray-layer.b{background:repeating-conic-gradient(from 10deg, rgba(255,250,220,0.35) 0deg 3deg, transparent 3deg 20deg); animation:spinRev 46s linear infinite;}
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes spinRev{ to{transform:rotate(-360deg);} }
  .sun-core{
    position:absolute;left:50%;top:36%;width:16vmin;height:16vmin;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle, #fffdf3 0%, #ffe37a 45%, rgba(255,201,60,0) 74%);
    box-shadow:0 0 7vmin 2.5vmin rgba(255,214,90,0.55);
    animation:sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse{ 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.05);} }

  #tsunamiSvg path{transform-box:fill-box;}
  #waveBack{animation:swellBack 6s ease-in-out infinite;}
  #waveFront{animation:swellFront 4.5s ease-in-out infinite;}
  #foam{animation:swellFront 4.5s ease-in-out infinite;}
  @keyframes swellBack{ 0%,100%{transform:translate(0,26px);} 50%{transform:translate(-16px,-14px);} }
  @keyframes swellFront{ 0%,100%{transform:translate(0,20px);} 50%{transform:translate(14px,-24px);} }

  @keyframes driftSlow{
    0%,100%{ transform:translate(0,0) scale(1); opacity:0.5; }
    50%{ transform:translate(4vw,-1vh) scale(1.1); opacity:0.85; }
  }
  @keyframes auroraWave{
    0%,100%{ transform:translateX(0) skewX(-8deg) scaleY(1); opacity:0.7; }
    50%{ transform:translateX(12vw) skewX(6deg) scaleY(1.15); opacity:1; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') || 'snow';
const opacityPct = Math.max(5, Math.min(100, parseInt(params.get('opacity')||'85',10)));
const density = Math.max(0, Math.min(100, parseInt(params.get('density')||'50',10)));
document.getElementById('stage').style.opacity = opacityPct/100;

function initCanvas(){
  const canvas = document.getElementById('canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  return ctx;
}

function startSnow(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(15 + density*1.35);
  const flakes = Array.from({length:count}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: 1.4+Math.random()*3.2, speed: 0.35+Math.random()*1.1,
    phase: Math.random()*Math.PI*2, alpha: 0.45+Math.random()*0.45
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#ffffff';
    flakes.forEach(f=>{
      f.y += f.speed;
      f.x += Math.sin(t*0.001 + f.phase)*0.5;
      if (f.y - f.r > canvas.height){ f.y = -f.r; f.x = Math.random()*canvas.width; }
      if (f.x < -10) f.x = canvas.width+10;
      if (f.x > canvas.width+10) f.x = -10;
      ctx.globalAlpha = f.alpha;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startRain(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(30 + density*1.7);
  const drops = Array.from({length:count}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    len: 10+Math.random()*16, speed: 7+Math.random()*7, alpha: 0.2+Math.random()*0.35
  }));
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#cfe3ff'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    drops.forEach(d=>{
      d.y += d.speed; d.x -= d.speed*0.18;
      if (d.y - d.len > canvas.height){ d.y = -10; d.x = Math.random()*canvas.width; }
      if (d.x < -20) d.x = canvas.width+20;
      ctx.globalAlpha = d.alpha;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.speed*0.18, d.y - d.len);
      ctx.stroke();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startHail(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(10 + density*0.55);
  const stones = Array.from({length:count}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: 2+Math.random()*2.6, speed: 9+Math.random()*6, alpha: 0.5+Math.random()*0.4
  }));
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stones.forEach(s=>{
      s.y += s.speed; s.x -= s.speed*0.12;
      if (s.y - s.r > canvas.height){ s.y = -10; s.x = Math.random()*canvas.width; }
      if (s.x < -10) s.x = canvas.width+10;
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#eef3f8';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = s.alpha*0.8;
      ctx.strokeStyle = '#aebfce'; ctx.lineWidth = 0.6; ctx.stroke();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function renderSun(){
  document.getElementById('stage').insertAdjacentHTML('beforeend',
    `<div class="sun-core" style="width:34vmin;height:34vmin;top:42%;"></div>`);
}

function renderRays(){
  document.getElementById('stage').insertAdjacentHTML('beforeend', `
    <div class="rays-wrap">
      <div class="ray-layer a"></div>
      <div class="ray-layer b"></div>
    </div>
    <div class="sun-core"></div>`);
}

function startLightning(){
  document.getElementById('stage').insertAdjacentHTML('beforeend', `
    <div id="flashOverlay" style="position:absolute;inset:0;background:#eaf3ff;opacity:0;"></div>
    <svg id="boltSvg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="boltPath" fill="none" stroke="#eef6ff" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`);
  const flashEl = document.getElementById('flashOverlay');
  const boltEl = document.getElementById('boltSvg');
  const boltPath = document.getElementById('boltPath');

  function randomBoltD(){
    let x = 25+Math.random()*50, y = 0;
    let d = `M ${x.toFixed(1)} ${y}`;
    const steps = 6+Math.floor(Math.random()*4);
    for (let i=0;i<steps;i++){
      y += 62/steps;
      x += (Math.random()*22-11);
      d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d;
  }
  function flash(){
    boltPath.setAttribute('d', randomBoltD());
    boltEl.style.transition = 'none'; boltEl.style.opacity = '0.95';
    flashEl.style.transition = 'none'; flashEl.style.opacity = '0.55';
    setTimeout(()=>{
      boltEl.style.transition = 'opacity .15s ease'; boltEl.style.opacity = '0';
      flashEl.style.transition = 'opacity .35s ease'; flashEl.style.opacity = '0';
    }, 90);
    setTimeout(()=>{
      flashEl.style.transition = 'none'; flashEl.style.opacity = '0.22';
      setTimeout(()=>{ flashEl.style.transition = 'opacity .3s ease'; flashEl.style.opacity = '0'; }, 70);
    }, 260);
    scheduleNext();
  }
  function scheduleNext(){
    const base = 9000 - density*70;
    const delay = base*0.35 + Math.random()*base*0.65;
    setTimeout(flash, delay);
  }
  scheduleNext();
}

function renderRainbow(){
  document.getElementById('stage').insertAdjacentHTML('beforeend',
    `<svg id="rainbowSvg" viewBox="0 0 200 100" preserveAspectRatio="xMidYMax meet" style="position:absolute;inset:0;width:100%;height:100%;"></svg>`);
  const svg = document.getElementById('rainbowSvg');
  const colors = ['#ff5b5b','#ff9d4d','#ffe066','#8fe38f','#5bb3ff','#7a7aff','#c07aff'];
  const cx = 100, cy = 104, rStart = 92, bandW = 6.4;
  colors.forEach((c,i)=>{
    const r = rStart - i*bandW;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`);
    path.setAttribute('stroke', c);
    path.setAttribute('stroke-width', bandW);
    path.setAttribute('fill', 'none');
    path.style.opacity = '0';
    path.style.transition = 'opacity 1s ease';
    svg.appendChild(path);
    setTimeout(()=>{ path.style.opacity = '0.9'; }, 150*i);
  });
}

function startTsunami(){
  document.getElementById('stage').insertAdjacentHTML('beforeend', `
    <svg id="tsunamiSvg" viewBox="0 0 400 200" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
      <path id="waveBack" d="M-50,130 C0,100 50,155 100,130 C150,105 200,155 250,130 C300,105 350,155 400,130 C420,120 450,130 450,130 L450,220 L-50,220 Z" fill="#1f6fa8" opacity="0.5"></path>
      <path id="waveFront" d="M-50,145 C0,115 50,170 100,145 C150,120 200,170 250,145 C300,120 350,170 400,145 C420,135 450,145 450,145 L450,220 L-50,220 Z" fill="#2f8fd1" opacity="0.8"></path>
      <path id="foam" d="M-50,145 C0,115 50,170 100,145 C150,120 200,170 250,145 C300,120 350,170 400,145 C420,135 450,145 450,145" fill="none" stroke="#eef8ff" stroke-width="4" opacity="0.85"></path>
    </svg>`);
}

function startFog(){
  const stage = document.getElementById('stage');
  const count = 5 + Math.round(density/25);
  for (let i=0;i<count;i++){
    const el = document.createElement('div');
    const w = 50+Math.random()*40, h = w*0.35;
    el.style.cssText = `position:absolute;width:${w}vmin;height:${h}vmin;border-radius:50%;
      left:${Math.random()*90-10}%; top:${68+Math.random()*35}%;
      background:radial-gradient(ellipse, rgba(230,235,240,0.6), rgba(230,235,240,0) 70%);
      filter:blur(10px);
      animation: driftSlow ${24+Math.random()*18}s ease-in-out infinite; animation-delay:-${Math.random()*20}s;`;
    stage.appendChild(el);
  }
}

function startPetals(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(12 + density*0.7);
  const petals = Array.from({length:count}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    size: 5+Math.random()*5, speed: 0.5+Math.random()*0.9,
    phase: Math.random()*Math.PI*2, rot: Math.random()*Math.PI*2, rotSpeed:(Math.random()*2-1)*0.02,
    hue: Math.random()<0.5?'255,200,215':'255,235,240'
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    petals.forEach(p=>{
      p.y += p.speed; p.x += Math.sin(t*0.001+p.phase)*0.8; p.rot += p.rotSpeed;
      if (p.y - p.size > canvas.height){ p.y = -p.size; p.x = Math.random()*canvas.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = `rgba(${p.hue},0.8)`;
      ctx.beginPath(); ctx.ellipse(0,0,p.size,p.size*0.55,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startMeteors(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  let meteors = [];
  function spawn(){
    meteors.push({
      x: Math.random()*canvas.width*0.7 + canvas.width*0.2, y: -20,
      vx: 3+Math.random()*2, vy: 5+Math.random()*3, len: 60+Math.random()*40
    });
    setTimeout(spawn, (500 - density*3) + Math.random()*(1800-density*10));
  }
  spawn();
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    meteors = meteors.filter(m=> m.y < canvas.height+60 && m.x < canvas.width+60);
    meteors.forEach(m=>{
      m.x += m.vx; m.y += m.vy;
      const mag = Math.hypot(m.vx,m.vy);
      const tx = m.x-m.vx/mag*m.len, ty = m.y-m.vy/mag*m.len;
      const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
      grad.addColorStop(0,'rgba(255,255,255,0.95)');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle = grad; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startAurora(){
  const stage = document.getElementById('stage');
  const colors = ['rgba(90,255,180,0.35)','rgba(120,200,255,0.3)','rgba(190,120,255,0.3)'];
  colors.forEach((c,i)=>{
    const el = document.createElement('div');
    el.style.cssText = `position:absolute;left:${-10+i*10}%;top:-10%;width:60%;height:75%;
      background:linear-gradient(180deg, ${c}, transparent 70%);
      filter:blur(20px); transform-origin:top center;
      animation: auroraWave ${14+i*4}s ease-in-out infinite; animation-delay:-${i*3}s;`;
    stage.appendChild(el);
  });
}

function startLava(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(15+density*0.9);
  const embers = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:canvas.height+Math.random()*100,
    r:1.5+Math.random()*2.5, speed:0.6+Math.random()*1.4, drift:(Math.random()*2-1)*0.4,
    life:Math.random()
  }));
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const glowH = canvas.height*0.15;
    const glow = ctx.createLinearGradient(0,canvas.height,0,canvas.height-glowH);
    glow.addColorStop(0,'rgba(255,120,40,0.35)'); glow.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=glow; ctx.fillRect(0,canvas.height-glowH,canvas.width,glowH);
    embers.forEach(e=>{
      e.y -= e.speed; e.x += e.drift; e.life -= 0.004;
      if (e.y < -10 || e.life<=0){ e.y=canvas.height+10; e.x=Math.random()*canvas.width; e.life=1; }
      ctx.globalAlpha = Math.max(0,e.life);
      ctx.fillStyle = Math.random()<0.5 ? '#ff8a3d':'#ffce54';
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startSandstorm(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(40+density*1.6);
  const grains = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    speed:3+Math.random()*5, size:0.8+Math.random()*1.8, phase:Math.random()*Math.PI*2
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1; ctx.fillStyle='rgba(210,175,120,0.06)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    grains.forEach(g=>{
      g.x += g.speed; g.y += Math.sin(t*0.002+g.phase)*0.6;
      if (g.x > canvas.width+10) g.x = -10;
      ctx.globalAlpha = 0.35+Math.random()*0.3;
      ctx.fillStyle = '#d9b878';
      ctx.fillRect(g.x,g.y,g.size*3,g.size);
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function startLeaves(){
  const ctx = initCanvas(); const canvas = ctx.canvas;
  const count = Math.round(12+density*0.7);
  const colors = ['#d9772e','#c9432f','#e0a52e','#9c5a26'];
  const leaves = Array.from({length:count},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    size:6+Math.random()*6, speed:0.6+Math.random()*1, phase:Math.random()*Math.PI*2,
    rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()*2-1)*0.03,
    color: colors[Math.floor(Math.random()*colors.length)]
  }));
  function tick(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    leaves.forEach(l=>{
      l.y += l.speed; l.x += Math.sin(t*0.0012+l.phase)*1.1; l.rot += l.rotSpeed;
      if (l.y - l.size > canvas.height){ l.y=-l.size; l.x=Math.random()*canvas.width; }
      ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(l.rot);
      ctx.fillStyle = l.color;
      ctx.beginPath(); ctx.ellipse(0,0,l.size,l.size*0.6,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

const renderers = {
  snow: startSnow, rain: startRain, hail: startHail,
  sun: renderSun, rays: renderRays, lightning: startLightning,
  rainbow: renderRainbow, tsunami: startTsunami,
  fog: startFog, petals: startPetals, meteors: startMeteors,
  aurora: startAurora, lava: startLava, sandstorm: startSandstorm, leaves: startLeaves
};
(renderers[type] || startSnow)();
</script>
</body>
</html>
